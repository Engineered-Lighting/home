[package]
name = "home"
version = "0.1.0"
description = "Local AI chat client for Home Assistant"
authors = ["Engineered Lighting"]
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Production webviews must not expose an inspector capable of reading private
# application state. Use a separate debug-only manifest for local inspection.
tauri = { version = "2", features = ["protocol-asset"] }
# Single-instance plugin: prevents a second home.exe from creating a
# second window. Second launch focuses the existing window instead.
# Avoids "two app windows fighting over MJPEG TCP connections to HA".
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
sha2 = "0.10"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
