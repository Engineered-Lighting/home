name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  # action-gh-release needs to write assets to releases. Org default is
  # read-only — without this it fails with "Resource not accessible by
  # integration."
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runs-on: windows-latest
            bundle_glob: app/src-tauri/target/release/bundle/msi/Home_*_x64_en-US.msi
            tauri_target: ""
          - name: macos-arm64
            runs-on: macos-14
            bundle_glob: app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Home_*_aarch64.dmg
            tauri_target: aarch64-apple-darwin
          # Intel macOS (macos-13) was added but stayed queued for 3+ hours
          # on contended free-tier runners. Apple Silicon is the dominant
          # platform; Intel Mac users can build from source via
          # `cargo tauri build` (instructions in app/README.md).

    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.tauri_target }}

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.name }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Extract release notes
        run: node tools/release/extract-release-notes.mjs "${{ github.ref_name }}" > release-notes.md

      - name: Build (Windows)
        if: matrix.name == 'windows'
        working-directory: app/src-tauri
        run: cargo tauri build

      - name: Build (macOS)
        if: startsWith(matrix.name, 'macos')
        working-directory: app/src-tauri
        run: cargo tauri build --target ${{ matrix.tauri_target }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.bundle_glob }}
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
