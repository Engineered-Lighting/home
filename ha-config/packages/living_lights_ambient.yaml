# living_lights_ambient.yaml - Layer 2d ambient L/R switches.
#
# The two ambient smart switches stay ON day and night, and turn OFF only
# during a movie, while away, or while the house is asleep. They are on/off
# only (no brightness) - so they are NOT part of the confidence ramp; they
# moved here out of the sofa pilot.
#
# "During a movie" is binary_sensor.living_lights_tv_playing (generated in
# living_lights_observability.yaml): one predicate shared by every package,
# with the unavailable-blip delay_off and the belief fail-safe inside it.
# This file no longer reads media_player.lg_tv directly - lg_tv reads
# unavailable when the TV is off and blips unavailable while it is on, so
# a raw state test cut the strips on blips and disagreed with the pilots.
#
# Gated like the pilots: inert until living_lights_enabled = on,
# living_lights_shadow = off, and living_lights_travel_mode = off.
#
# Rollback: delete this file + reload automations.

automation:
  - alias: "Living Lights — ambient switches"
    id: living_lights_ambient
    description: >
      Ambient left/right switches: on day + night, off only during a
      movie, while away, or while asleep.
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.living_lights_tv_playing
          - input_boolean.user_at_home
          - input_boolean.living_lights_asleep
          - input_boolean.living_lights_travel_mode
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.living_lights_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.living_lights_shadow
        state: "off"
      - condition: state
        entity_id: input_boolean.living_lights_travel_mode
        state: "off"
    actions:
      - if:
          - condition: template
            value_template: >-
              {{ is_state('binary_sensor.living_lights_tv_playing', 'on')
                 or is_state('input_boolean.user_at_home', 'off')
                 or is_state('input_boolean.living_lights_asleep', 'on') }}
        then:
          - action: switch.turn_off
            target:
              entity_id:
                - switch.ambient_light_left_mss110_main_channel
                - switch.ambient_light_right_mss110_main_channel
        else:
          - action: switch.turn_on
            target:
              entity_id:
                - switch.ambient_light_left_mss110_main_channel
                - switch.ambient_light_right_mss110_main_channel
