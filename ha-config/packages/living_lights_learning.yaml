          - condition: template
            value_template: "{{ is_duplicate != true and is_duplicate != 'true' }}"
        then:
          # ── EMIT branch ─────────────────────────────────────────────
          - action: shell_command.living_lights_capture_preference
            data:
              payload: "{{ json_payload | base64_encode }}"
          - event: living_lights_preference_pending
