  - alias: "Living Lights — manual touch detection (light.front_right)"
    id: living_lights_manual_detect_front_right
    # M19: queued (not single) so rapid slider scrubs / multi-step brightness
    # changes within the 3-s settle window don't drop the FINAL evidence with
    # "Already running" warnings. `max: 20` is the burst headroom — a normal
    # slider scrub fires 3-8 state-change events before settling; 20 covers
    # extreme bursts (Hue-app rapid dimming, RGB picker sweeps) with margin.
    # Each queued instance still respects the variables-block dedupe logic
    # (last_override_context_id flicker-count guards downstream JSONL
    # duplication), so a 20-event burst produces at most one logged
    # override_event per truly-distinct context.
    mode: queued
    max: 20
    triggers:
      - trigger: state
        entity_id: light.front_right
        for: "00:00:03"
      - trigger: state
        entity_id: light.front_right
        attribute: brightness
        for: "00:00:03"
      - trigger: state
        entity_id: light.front_right
        attribute: color_temp_kelvin
        for: "00:00:03"
      - trigger: state
        entity_id: light.front_right
        attribute: color_temp
        for: "00:00:03"
    conditions:
      - condition: state
        entity_id: input_boolean.living_lights_enabled
        state: "on"
    actions:
      - variables:
          actual_pct: >-
            {% if is_state('light.front_right', 'on') %}
            {{ ((state_attr('light.front_right', 'brightness') | float(0)) / 2.55) | round(0) | int }}
            {% else %}0{% endif %}
          light_state: "{{ states('light.front_right') }}"
          match_ok: >-
            {% set ns = namespace(ok=false) %}
            {% set ap = ((state_attr('light.front_right', 'brightness') | float(0)) / 2.55) | round(0) | int if is_state('light.front_right', 'on') else 0 %}
            {% if not ns.ok %}
              {% set p = state_attr('sensor.living_room_front_door_lighting_state', 'predicted_brightness_pct') | float(-1) %}
              {% set ri = state_attr('sensor.living_room_front_door_lighting_state', 'ramp_initial_pct') | float(-1) %}
              {% set st = states('sensor.living_room_front_door_lighting_state') %}
              {% if p < 0 %}{% set ns.ok = true %}
              {% elif (ap - p) | abs <= 10 %}{% set ns.ok = true %}
              {% elif st == 'present' and ri >= 0 and ap >= ([ri, p] | min - 5) and ap <= ([ri, p] | max + 5) %}{% set ns.ok = true %}
              {% endif %}
            {% endif %}
            {% if not ns.ok %}
              {% set p = state_attr('sensor.living_room_weights_lighting_state', 'predicted_brightness_pct') | float(-1) %}
              {% set ri = state_attr('sensor.living_room_weights_lighting_state', 'ramp_initial_pct') | float(-1) %}
              {% set st = states('sensor.living_room_weights_lighting_state') %}
              {% if p < 0 %}{% set ns.ok = true %}
              {% elif (ap - p) | abs <= 10 %}{% set ns.ok = true %}
              {% elif st == 'present' and ri >= 0 and ap >= ([ri, p] | min - 5) and ap <= ([ri, p] | max + 5) %}{% set ns.ok = true %}
              {% endif %}
            {% endif %}
            {% if not ns.ok %}
              {% set p = state_attr('sensor.living_room_sofa_lighting_state', 'predicted_brightness_pct') | float(-1) %}
              {% set ri = state_attr('sensor.living_room_sofa_lighting_state', 'ramp_initial_pct') | float(-1) %}
              {% set st = states('sensor.living_room_sofa_lighting_state') %}
              {% if p < 0 %}{% set ns.ok = true %}
              {% elif (ap - p) | abs <= 10 %}{% set ns.ok = true %}
              {% elif st == 'present' and ri >= 0 and ap >= ([ri, p] | min - 5) and ap <= ([ri, p] | max + 5) %}{% set ns.ok = true %}
              {% endif %}
            {% endif %}
            {% if not ns.ok %}
