<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Home · Shared preference</title>
  <link rel="stylesheet" href="./preference-review.css">
  <script defer src="./api.js"></script>
  <script defer src="./preference-review.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">shared preference · both homes</p>
    <p id="status" role="status" aria-live="polite">Checking your Home Agent sign-in…</p>
    <p id="detail"></p>
    <div class="actions">
      <button id="confirm" type="button" class="primary" disabled hidden>confirm</button>
      <button id="check" type="button" class="primary" hidden>check outcome</button>
      <a id="sign-in" href="./index.html" target="_blank" rel="noopener noreferrer" hidden>sign in ↗</a>
      <button id="retry-session" type="button" hidden>check sign-in</button>
      <button id="cancel" type="button" hidden>cancel</button>
    </div>
    <p class="note">memory only · lights unchanged</p>
  </main>
</body>
</html>
