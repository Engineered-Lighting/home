    max: 20
    triggers:
      - trigger: state
        entity_id: light.rear_left
        for: "00:00:03"
      - trigger: state
        entity_id: light.rear_left
        attribute: brightness
        for: "00:00:03"
      - trigger: state
        entity_id: light.rear_left
        attribute: color_temp_kelvin
        for: "00:00:03"
