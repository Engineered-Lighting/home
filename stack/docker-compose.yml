# Local Home Assistant voice assistant stack.
# See ADR.md for design rationale and README.md for operating instructions.
# Bring up:   docker compose up -d
# Tear down:  docker compose down
# Tail logs:  docker compose logs -f <service>

services:
  # =========================================================
  # LLM + vision: Qwen3-VL-30B-A3B-Instruct served via vLLM. MoE (3B
  # active params per token), native multimodal, Hermes tool calls.
  # Not exposed on the host — only the metrics-sidecar (which proxies
  # + tees chat completions) can reach it via the docker network.
  # =========================================================
  vllm:
    image: vllm/vllm-openai:latest
    container_name: hav-vllm
    restart: unless-stopped
    # vLLM is no longer published on the host — only reachable from the
    # metrics-sidecar (which proxies + tees chat completions to clients).
    # External HA traffic to :8000 now hits the sidecar, which forwards
    # to vllm:8000 inside the docker network.
    expose:
      - "8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - vllm_cache:/root/.cache/vllm
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    # List form avoids shell escaping for --default-chat-template-kwargs JSON.
    command:
      # Unified vision + tool-call model. Qwen3-VL-30B-A3B is a MoE with
      # only 3B active params per token (fast inference) but 30B total
      # knowledge, native multimodal vision, and Qwen3-family tool-call
      # behavior (qwen3_xml parser unchanged).
      - --model
      - Qwen/Qwen3-VL-30B-A3B-Instruct
      - --served-model-name
      - qwen3-vl-30b
      - --max-model-len
      - "16384"
      # 0.75 = ~72 GB on the 96 GB GPU. The model weights are ~60 GB in
      # BF16 — anything less than ~65 GB makes vLLM OOM after loading
      # the model and trying to allocate KV cache. Leaves ~24 GB free
      # for V-JEPA-2 + vision encoder buffers.
      - --gpu-memory-utilization
      - "0.75"
      - --max-num-seqs
      - "4"
      - --enable-prefix-caching
      # Vision: cap multimodal items per request to bound encoder VRAM.
      - --limit-mm-per-prompt
      - '{"image": 4, "video": 0}'
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --enable-auto-tool-choice
      # Qwen3-VL emits tool calls in Hermes format (JSON inside <tool_call>
      # tags), unlike text-only Qwen3 which uses qwen3_xml. Switching parser
      # accordingly — confirmed via direct vLLM probe.
      - --tool-call-parser
      - hermes
      - --port
      - "8000"
      - --host
      - "0.0.0.0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: "16gb"
    healthcheck:
      # vllm/vllm-openai ships python; avoid dependence on curl in the image.
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"
      interval: 30s
      timeout: 10s
      retries: 5
      # First start may pull ~30 GB of weights from HF; allow 15 minutes.
      start_period: 900s
    networks: [homeai]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # =========================================================
  # STT: NVIDIA Parakeet TDT v3 + Silero VAD via Wyoming.
  # Source: vrsttl/wyoming-parakeet-silero-wrapper (built locally).
  # Reachable at  tcp://${UBUNTU_IP}:10300
  # Run scripts/setup.sh once to clone the upstream repo.
  # =========================================================
  wyoming-parakeet:
    build:
      context: ./services/stt
      dockerfile: Dockerfile.parakeet
    image: home-ai-voice/wyoming-parakeet:local
    container_name: hav-wyoming-parakeet
    restart: unless-stopped
    ports:
      - "${PARAKEET_PORT:-10300}:10300"
    volumes:
      - parakeet_cache:/root/.cache/huggingface
      - ./services/stt/parakeet-wyoming-wrapper/config.yaml:/app/config.yaml:ro
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [homeai]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================
  # TTS engine: Chatterbox (OpenAI-compatible /v1/audio/speech).
  # Internal-facing; consumed by wyoming-chatterbox below.
  # Exposed on host for direct curl-based testing during bring-up.
  # =========================================================
  # TTS engine: Kokoro (82M params, multiple named voices, OpenAI-compatible
  # /v1/audio/speech). Built locally for Blackwell sm_120 (cu128 + torch 2.7).
  # Voice swap: TTS_VOICE in .env (am_michael default; also am_onyx, am_fenrir,
  # am_eric, am_adam, am_liam, am_puck, am_echo, bm_george).
  kokoro-tts:
    build:
      context: ./services/tts
      dockerfile: Dockerfile.kokoro-blackwell
    image: home-ai-voice/kokoro-tts:blackwell
    container_name: hav-kokoro-tts
    restart: unless-stopped
    ports:
      - "${KOKORO_PORT:-8880}:8880"
    environment:
      USE_GPU: "true"
      PYTHONUNBUFFERED: "1"
      API_LOG_LEVEL: "INFO"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8880/v1/models').read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks: [homeai]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================
  # Wyoming bridge for TTS: exposes Chatterbox to HA Assist.
  # Reachable at  tcp://${UBUNTU_IP}:10301
  # =========================================================
  # Wyoming bridge for TTS: exposes Kokoro to HA Assist via Wyoming protocol.
  # Voice swap: edit TTS_VOICE in .env (am_michael, am_onyx, am_eric, etc.).
  #
  # Streaming: TTS_STREAMING_MODELS enables sentence-boundary chunking via
  # pySBD. The LLM response is split by sentence; each is synthesized in
  # parallel (up to 3 concurrent) and pushed to HA as Wyoming AudioChunk
  # events incrementally. First audio reaches Voice PE while later
  # sentences are still being generated.
  wyoming-kokoro:
    image: ghcr.io/roryeckel/wyoming_openai:latest
    container_name: hav-wyoming-kokoro
    restart: unless-stopped
    depends_on:
      kokoro-tts:
        condition: service_healthy
    ports:
      - "${WYOMING_TTS_PORT:-10301}:10300"
    environment:
      WYOMING_URI: tcp://0.0.0.0:10300
      WYOMING_LOG_LEVEL: INFO
      WYOMING_LANGUAGES: ${WYOMING_LANG:-en}
      TTS_OPENAI_URL: http://kokoro-tts:8880/v1
      TTS_BACKEND: OPENAI
      TTS_MODELS: ${TTS_MODEL:-kokoro}
      TTS_STREAMING_MODELS: ${TTS_MODEL:-kokoro}
      TTS_VOICES: ${TTS_VOICE:-am_michael}
      TTS_SPEED: "1.0"
    networks: [homeai]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================
  # Vision sidecar — frame-grabber + multimodal proxy.
  # Not a model. Pulls a fresh JPEG from HA's camera_proxy and forwards
  # it to vllm (which is now a vision-capable Qwen3-VL-30B-A3B) as an
  # OpenAI-style multimodal chat completion. Returns a short description.
  # =========================================================
  vision-sidecar:
    build:
      context: ./services/vision
    image: home-ai-voice/vision-sidecar:local
    container_name: hav-vision-sidecar
    restart: unless-stopped
    ports:
      - "${VISION_SIDECAR_PORT:-8091}:8091"
    environment:
      HA_URL: ${HA_URL:-http://<ha-host>:8123}
      HA_TOKEN: ${HA_TOKEN:?HA_TOKEN must be set in .env for vision sidecar}
      VLLM_URL: ${VLLM_URL:-http://vllm:8000}
      VISION_MODEL: ${VISION_MODEL:-qwen3-vl-30b}
      VISION_MAX_TOKENS: ${VISION_MAX_TOKENS:-200}
    depends_on:
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8091/healthz').read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [homeai]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================
  # Metrics sidecar — exposes a single JSON endpoint for the Home
  # desktop client to poll. Scrapes vLLM's Prometheus metrics for
  # token throughput, NVML for GPU util / VRAM, psutil for CPU / RAM.
  # Reachable at  http://${UBUNTU_IP}:8092/metrics
  # =========================================================
  metrics-sidecar:
    build:
      context: ./services/metrics-sidecar
    image: home-ai-voice/metrics-sidecar:local
    container_name: hav-metrics-sidecar
    restart: unless-stopped
    ports:
      # 8000: chat proxy — HA's Extended OpenAI Conv calls this for /v1/*
      # 8092: telemetry + conversation SSE stream for the Home desktop app
      - "${VLLM_PORT:-8000}:8092"
      - "${METRICS_SIDECAR_PORT:-8092}:8092"
    environment:
      VLLM_METRICS_URL: ${VLLM_METRICS_URL:-http://vllm:8000/metrics}
      VLLM_UPSTREAM_URL: ${VLLM_UPSTREAM_URL:-http://vllm:8000}
      SCRAPE_INTERVAL_S: ${SCRAPE_INTERVAL_S:-2.0}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8092/healthz').read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - vllm
    networks: [homeai]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  homeai:
    driver: bridge
    name: homeai-net

volumes:
  hf_cache:
    name: hav_hf_cache
  vllm_cache:
    name: hav_vllm_cache
  chatterbox_models:
    name: hav_chatterbox_models
  chatterbox_voices:
    name: hav_chatterbox_voices
  parakeet_cache:
    name: hav_parakeet_cache
