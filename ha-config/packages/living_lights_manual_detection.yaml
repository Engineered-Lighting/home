              {% elif (ap - p) | abs <= 10 %}{% set ns.ok = true %}{% set ns.reason = 'matches_predicted_front_door' %}
              {% elif st == 'present' and ri >= 0 and ap >= ([ri, p] | min - 5) and ap <= ([ri, p] | max + 5) %}{% set ns.ok = true %}{% set ns.reason = 'in_ramp_window_front_door' %}
