      - condition: state
        entity_id: input_boolean.living_lights_enabled
        state: "on"
    actions:
      - variables:
          actual_pct: >-
            {% if is_state('light.rear_left', 'on') %}
            {{ ((state_attr('light.rear_left', 'brightness') | float(0)) / 2.55) | round(0) | int }}
            {% else %}0{% endif %}
          light_state: "{{ states('light.rear_left') }}"
          match_ok: >-
            {% set ns = namespace(ok=false) %}
            {% set ap = ((state_attr('light.rear_left', 'brightness') | float(0)) / 2.55) | round(0) | int if is_state('light.rear_left', 'on') else 0 %}
            {% if not ns.ok %}
              {% set p = state_attr('sensor.living_room_sofa_lighting_state', 'predicted_brightness_pct') | float(-1) %}
              {% set ri = state_attr('sensor.living_room_sofa_lighting_state', 'ramp_initial_pct') | float(-1) %}
              {% set st = states('sensor.living_room_sofa_lighting_state') %}
              {% if p < 0 %}{% set ns.ok = true %}
              {% elif (ap - p) | abs <= 10 %}{% set ns.ok = true %}
              {% elif st == 'present' and ri >= 0 and ap >= ([ri, p] | min - 5) and ap <= ([ri, p] | max + 5) %}{% set ns.ok = true %}
              {% endif %}
            {% endif %}
            {% if not ns.ok %}
              {% set g = state_attr('sensor.living_room_sofa_gradient', 'rear_left_pct') | float(-1) %}
              {% if g >= 0 and (ap - g) | abs <= 10 %}{% set ns.ok = true %}{% endif %}
            {% endif %}
            {{ ns.ok }}
          match_reason: >-
            {% set ns = namespace(ok=false, reason='none') %}
            {% set ap = ((state_attr('light.rear_left', 'brightness') | float(0)) / 2.55) | round(0) | int if is_state('light.rear_left', 'on') else 0 %}
            {% if not ns.ok %}
