              predicted_color_temp_kelvin: "{{ predicted_ct | int(0) }}"
              predictions_by_zone:
                island_left:
                  state: "{{ pred_island_left_state }}"
                  predicted_pct: "{{ pred_island_left_p | int(0) }}"
                  ramp_initial_pct: "{{ pred_island_left_ri | int(0) }}"
              prediction_consistency:
                primary_prediction_pct: "{{ primary_prediction_pct | int(0) }}"
