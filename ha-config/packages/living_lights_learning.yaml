          pred_front_left_p: "{{ state_attr('sensor.living_room_front_left_lighting_state', 'predicted_brightness_pct') | int(0) }}"
          pred_front_left_ri: "{{ state_attr('sensor.living_room_front_left_lighting_state', 'ramp_initial_pct') | int(0) }}"
          pred_sofa_state: "{{ states('sensor.living_room_sofa_lighting_state') }}"
