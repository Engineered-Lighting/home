networks:
  postgres-net: {internal: true}
  api-net:
    internal: true
    enable_ipv4: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: "${HOME_AGENT_API_SUBNET:-172.23.0.0/16}"
          ip_range: "${HOME_AGENT_API_DYNAMIC_RANGE:-172.23.128.0/17}"
          gateway: "${HOME_AGENT_API_GATEWAY:-172.23.0.1}"
  ingest-net: {internal: true}
  edge-public: {}
  bff-public:
    name: home-agent_bff-public
    internal: false
    enable_ipv4: true
    enable_ipv6: false
    driver_opts:
      # A stable interface name makes the host firewall rule survive Docker
      # network/container recreation without admitting the whole Docker pool.
      com.docker.network.bridge.name: "${HOME_AGENT_BFF_EGRESS_BRIDGE:-ha-bff-egress0}"
    ipam:
      config:
        - subnet: "${HOME_AGENT_BFF_EGRESS_SUBNET:-172.22.0.0/24}"
          gateway: "${HOME_AGENT_BFF_EGRESS_GATEWAY:-172.22.0.1}"

volumes:
  postgres-socket: {}
