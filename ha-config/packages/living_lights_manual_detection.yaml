# living_lights_manual_detection.yaml — GENERATED by tools/build-living-lights-actuators.py
#
# Manual-touch detection + cooldown-expire + voice-override-reset.
#
# Detection fires `living_lights_override_detected` HA bus event whenever a
# light's brightness diverges from any owning zone's prediction (with ramp-
# window and sofa-gradient absorption). Event fires ALWAYS when
# input_boolean.living_lights_enabled is on. JSONL preference capture is
# additionally gated by input_boolean.living_lights_learning_enabled.
#
# Vacancy-expire writes the 1970-01-01 sentinel to last_manual_at after the
# zone has been vacant for 15 continuous minutes — the cooldown then treats
# the manual as fully expired even across cross-day re-entries.
#
# Voice-override-reset writes the sentinel when input_text.living_lights_
# override_text_<slug> is set (e.g., by the agent's set_presence_override
# tool) so voice commands supersede prior manual cooldown.
#
# DO NOT EDIT BY HAND. Edit tools/build-living-lights-actuators.py and re-run.

shell_command:
  living_lights_append_preference_log: 'sh -c "echo {{ payload }} | base64 -d >> /config/lighting_preferences_pending.jsonl; echo >> /config/lighting_preferences_pending.jsonl"'

automation:
  - alias: "Living Lights — manual touch detection (light.dining_table_left)"
    id: living_lights_manual_detect_dining_table_left
    # M19: queued (not single) so rapid slider scrubs / multi-step brightness
    # changes within the 3-s settle window don't drop the FINAL evidence with
    # "Already running" warnings. `max: 20` is the burst headroom — a normal
    # slider scrub fires 3-8 state-change events before settling; 20 covers
    # extreme bursts (Hue-app rapid dimming, RGB picker sweeps) with margin.
    # Each queued instance still respects the variables-block dedupe logic
    # (last_override_context_id flicker-count guards downstream JSONL
    # duplication), so a 20-event burst produces at most one logged
    # override_event per truly-distinct context.
    mode: queued
    max: 20
    triggers:
      - trigger: state
        entity_id: light.dining_table_left
        for: "00:00:03"
      - trigger: state
        entity_id: light.dining_table_left
        attribute: brightness
        for: "00:00:03"
    conditions:
      - condition: state
        entity_id: input_boolean.living_lights_enabled
        state: "on"
    actions:
      - variables:
          actual_pct: >-
            {% if is_state('light.dining_table_left', 'on') %}
            {{ ((state_attr('light.dining_table_left', 'brightness') | float(0)) / 2.55) | round(0) | int }}
            {% else %}0{% endif %}
          light_state: "{{ states('light.dining_table_left') }}"
          match_ok: >-
            {% set ns = namespace(ok=false) %}
            {% set ap = ((state_attr('light.dining_table_left', 'brightness') | float(0)) / 2.55) | round(0) | int if is_state('light.dining_table_left', 'on') else 0 %}
            {% if not ns.ok %}
              {% set p = state_attr('sensor.dining_room_dining_left_lighting_state', 'predicted_brightness_pct') | float(-1) %}
              {% set ri = state_attr('sensor.dining_room_dining_left_lighting_state', 'ramp_initial_pct') | float(-1) %}
              {% set st = states('sensor.dining_room_dining_left_lighting_state') %}
              {% if p < 0 %}{% set ns.ok = true %}
              {% elif (ap - p) | abs <= 10 %}{% set ns.ok = true %}
              {% elif st == 'present' and ri >= 0 and ap >= ([ri, p] | min - 5) and ap <= ([ri, p] | max + 5) %}{% set ns.ok = true %}
              {% endif %}
            {% endif %}
            {{ ns.ok }}
          match_reason: >-
            {% set ns = namespace(ok=false, reason='none') %}
            {% set ap = ((state_attr('light.dining_table_left', 'brightness') | float(0)) / 2.55) | round(0) | int if is_state('light.dining_table_left', 'on') else 0 %}
            {% if not ns.ok %}
              {% set p = state_attr('sensor.dining_room_dining_left_lighting_state', 'predicted_brightness_pct') | float(-1) %}
              {% set ri = state_attr('sensor.dining_room_dining_left_lighting_state', 'ramp_initial_pct') | float(-1) %}
              {% set st = states('sensor.dining_room_dining_left_lighting_state') %}
              {% if p < 0 %}{% set ns.ok = true %}{% set ns.reason = 'classifier_unavailable_dining_left' %}
              {% elif (ap - p) | abs <= 10 %}{% set ns.ok = true %}{% set ns.reason = 'matches_predicted_dining_left' %}
              {% elif st == 'present' and ri >= 0 and ap >= ([ri, p] | min - 5) and ap <= ([ri, p] | max + 5) %}{% set ns.ok = true %}{% set ns.reason = 'in_ramp_window_dining_left' %}
              {% endif %}
            {% endif %}
            {{ ns.reason }}
          pred_dining_left_state: "{{ states('sensor.dining_room_dining_left_lighting_state') }}"
          pred_dining_left_p: "{{ state_attr('sensor.dining_room_dining_left_lighting_state', 'predicted_brightness_pct') | int(0) }}"
          pred_dining_left_ri: "{{ state_attr('sensor.dining_room_dining_left_lighting_state', 'ramp_initial_pct') | int(0) }}"
          pred_dining_left_ct: "{{ state_attr('sensor.dining_room_dining_left_lighting_state', 'predicted_color_temp_kelvin') | int(0) }}"
          shadow_mode: "{{ is_state('input_boolean.living_lights_shadow', 'on') }}"
          profile_state: "{{ states('sensor.living_lights_profile') }}"
          tv_playing: "{{ states('media_player.lg_tv') in ['on', 'playing', 'paused', 'buffering'] }}"
          # M22a-aligned: gaming context dimension. Mirrors the classifier's
          # `gaming_active` truth so override_event.context records the
          # gaming state at the moment the user touched a light. Downstream
          # M22 + Codex session-classification can read this to learn that
          # gaming sessions are a distinct policy context.
          gaming_active: "{{ is_state('input_boolean.living_lights_gaming_enabled', 'on') and state_attr('sensor.steam_steam_76561198136331341', 'game') not in [none, '', 'unavailable', 'unknown'] }}"
          asleep_state: "{{ is_state('input_boolean.living_lights_asleep', 'on') }}"
          night_safe_state: "{{ is_state('binary_sensor.living_lights_is_night_safe', 'on') }}"
          user_at_home_state: "{{ is_state('input_boolean.user_at_home', 'on') }}"
          any_occupied_state: "{{ is_state('binary_sensor.living_lights_any_occupied', 'on') }}"
          ctx_id: "ovr-{{ now().timestamp() | int }}-{{ now().microsecond }}"
      - if:
          - condition: template
            value_template: "{{ match_ok != true and match_ok != 'true' }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id:
              - input_datetime.living_lights_zone_dining_left_last_manual_at
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          # M4: stamp ctx_id on every owning zone so capture-on-vacant can
          # populate `related_override_context_id` for the same zone later.
          - action: input_text.set_value
            target:
              entity_id:
              - input_text.living_lights_zone_dining_left_last_override_context_id
            data:
              value: "{{ ctx_id }}"
          - event: living_lights_override_detected
            event_data:
              context_id: "{{ ctx_id }}"
              ts: "{{ now().isoformat() }}"
              zone: "dining_left"
              light_entity: "light.dining_table_left"
              camera: "dining_room"
              owning_zones: ["dining_left"]
              actual_pct: "{{ actual_pct | int(0) }}"
              predicted_pct: "{{ pred_dining_left_p | int(0) }}"
              delta_pct: "{{ (actual_pct | int(0)) - (pred_dining_left_p | int(0)) }}"
              light_state: "{{ light_state }}"
              predictions_by_zone:
                dining_left:
                  state: "{{ pred_dining_left_state }}"
                  predicted_pct: "{{ pred_dining_left_p | int(0) }}"
                  ramp_initial_pct: "{{ pred_dining_left_ri | int(0) }}"
              state: "{{ pred_dining_left_state }}"
              profile: "{{ profile_state }}"
              tv_playing: "{{ tv_playing }}"
              gaming_active: "{{ gaming_active }}"
              asleep: "{{ asleep_state }}"
              night_safe: "{{ night_safe_state }}"
              user_at_home: "{{ user_at_home_state }}"
              anticipated_room: null
              any_occupied: "{{ any_occupied_state }}"
              shadow_mode: "{{ shadow_mode }}"
              source_user_id: "{{ trigger.to_state.context.user_id | default(none, true) }}"
              debug_match_reason: "{{ match_reason }}"
          - if:
              - condition: state
                entity_id: input_boolean.living_lights_learning_enabled
                state: "on"
            then:
              - variables:
                  json_payload: >-
                    {{ {
                      'kind': 'override_event',
                      'ts': now().isoformat(),
                      'context_id': ctx_id,
                      'zone': 'dining_left',
                      'light_entity': 'light.dining_table_left',
                      'camera': 'dining_room',
                      'owning_zones': ['dining_left'],
                      'observed': {'brightness_pct': actual_pct | int(0), 'light_state': light_state},
                      'predicted': {
                        'brightness_pct': pred_dining_left_p | int(0),
                        'color_temp_kelvin': pred_dining_left_ct | int(0)
                      },
                      'delta_pct': (actual_pct | int(0)) - (pred_dining_left_p | int(0)),
                      'predictions_by_zone': {
                        'dining_left': {'state': pred_dining_left_state, 'predicted_pct': pred_dining_left_p | int(0), 'ramp_initial_pct': pred_dining_left_ri | int(0)},
                      },
                      'context': {
                        'state': pred_dining_left_state,
                        'profile': profile_state,
                        'tv_playing': tv_playing,
                        'gaming_active': gaming_active,
                        'asleep': asleep_state,
                        'night_safe': night_safe_state,
                        'user_at_home': user_at_home_state,
                        'anticipated_room': none,
                        'any_occupied': any_occupied_state,
                        'shadow_mode': shadow_mode,
                        'source_user_id': trigger.to_state.context.user_id | default(none, true)
                      },
                      'debug_match_reason': match_reason
                    } | tojson }}
              - action: shell_command.living_lights_append_preference_log
                data:
                  payload: "{{ json_payload | base64_encode }}"

