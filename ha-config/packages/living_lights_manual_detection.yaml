          # populate `related_override_context_id` for the same zone later.
          - action: input_text.set_value
            target:
              entity_id:
              - input_text.living_lights_zone_front_door_last_override_context_id
              - input_text.living_lights_zone_weights_last_override_context_id
              - input_text.living_lights_zone_sofa_last_override_context_id
            data:
              value: "{{ ctx_id }}"
          - event: living_lights_override_detected
            event_data:
              context_id: "{{ ctx_id }}"
              ts: "{{ now().isoformat() }}"
              zone: "front_door"
              light_entity: "light.front_right"
              camera: "living_room"
              owning_zones: ["front_door", "weights", "sofa"]
              actual_pct: "{{ actual_pct | int(0) }}"
              predicted_pct: "{{ pred_front_door_p | int(0) }}"
              delta_pct: "{{ (actual_pct | int(0)) - (pred_front_door_p | int(0)) }}"
              light_state: "{{ light_state }}"
              predictions_by_zone:
                front_door:
                  state: "{{ pred_front_door_state }}"
                  predicted_pct: "{{ pred_front_door_p | int(0) }}"
                  ramp_initial_pct: "{{ pred_front_door_ri | int(0) }}"
                weights:
                  state: "{{ pred_weights_state }}"
                  predicted_pct: "{{ pred_weights_p | int(0) }}"
                  ramp_initial_pct: "{{ pred_weights_ri | int(0) }}"
                sofa:
                  state: "{{ pred_sofa_state }}"
                  predicted_pct: "{{ pred_sofa_p | int(0) }}"
                  ramp_initial_pct: "{{ pred_sofa_ri | int(0) }}"
              state: "{{ pred_front_door_state }}"
              profile: "{{ profile_state }}"
              tv_playing: "{{ tv_playing }}"
              gaming_active: "{{ gaming_active }}"
              asleep: "{{ asleep_state }}"
              night_safe: "{{ night_safe_state }}"
              user_at_home: "{{ user_at_home_state }}"
              anticipated_room: null
              any_occupied: "{{ any_occupied_state }}"
              shadow_mode: "{{ shadow_mode }}"
              source_user_id: "{{ trigger.to_state.context.user_id | default(none, true) }}"
              debug_match_reason: "{{ match_reason }}"
          - if:
              - condition: state
                entity_id: input_boolean.living_lights_learning_enabled
                state: "on"
            then:
              - variables:
                  json_payload: >-
                    {{ {
                      'kind': 'override_event',
                      'ts': now().isoformat(),
                      'context_id': ctx_id,
                      'zone': 'front_door',
                      'light_entity': 'light.front_right',
                      'camera': 'living_room',
                      'owning_zones': ['front_door', 'weights', 'sofa'],
                      'observed': {'brightness_pct': actual_pct | int(0), 'light_state': light_state},
                      'predicted': {
                        'brightness_pct': pred_front_door_p | int(0),
                        'color_temp_kelvin': pred_front_door_ct | int(0)
                      },
                      'delta_pct': (actual_pct | int(0)) - (pred_front_door_p | int(0)),
                      'predictions_by_zone': {
                        'front_door': {'state': pred_front_door_state, 'predicted_pct': pred_front_door_p | int(0), 'ramp_initial_pct': pred_front_door_ri | int(0)},
                        'weights': {'state': pred_weights_state, 'predicted_pct': pred_weights_p | int(0), 'ramp_initial_pct': pred_weights_ri | int(0)},
                        'sofa': {'state': pred_sofa_state, 'predicted_pct': pred_sofa_p | int(0), 'ramp_initial_pct': pred_sofa_ri | int(0)},
                      },
