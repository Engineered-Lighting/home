              {% set p = state_attr('sensor.living_room_weights_lighting_state', 'predicted_brightness_pct') | float(-1) %}
              {% set ri = state_attr('sensor.living_room_weights_lighting_state', 'ramp_initial_pct') | float(-1) %}
