mqtt:
  enabled: true
  host: core-mosquitto
  port: 1883
  user: frigate
  password: frigatepass

# Use Intel iGPU (VAAPI) for decoding
ffmpeg:
  hwaccel_args: preset-vaapi

# go2rtc restreaming — exposes RTSP streams for external consumers (Jetson world model)
go2rtc:
  streams:
    living_room:
      - rtsp://EngineeredLighting:IpanemaPosto10!@192.168.0.227:554/stream1
    living_room_sub:
      - rtsp://EngineeredLighting:IpanemaPosto10!@192.168.0.227:554/stream2
    dining_room:
      - rtsp://EngineeredLighting:IpanemaPosto10!@192.168.0.92:554/stream1
    dining_room_sub:
      - rtsp://EngineeredLighting:IpanemaPosto10!@192.168.0.92:554/stream2
    workshop:
      - rtsp://EngineeredLighting:IpanemaPosto10!@192.168.0.54:554/stream1
    workshop_sub:
      - rtsp://EngineeredLighting:IpanemaPosto10!@192.168.0.54:554/stream2
    driveway:
      - rtsp://EngineeredLighting:IpanemaPosto10!@192.168.0.68:554/stream1
    driveway_sub:
      - rtsp://EngineeredLighting:IpanemaPosto10!@192.168.0.68:554/stream2
    kitchen:
      - rtsp://EngineeredLighting:IpanemaPosto10!@192.168.0.64:554/stream1
    kitchen_sub:
      - rtsp://EngineeredLighting:IpanemaPosto10!@192.168.0.64:554/stream2

detectors:
  coral:
    type: edgetpu
    device: pci

# ── Semantic search for rich querying of tracked objects ──
semantic_search:
  enabled: true
  model_size: small

# ── Audio detection — detect sounds for richer context ──
audio:
  enabled: true
  listen:
    - bark
    - fire_alarm
    - scream
    - speech
    - yell
    - glass_breaking
    - doorbell
    - knock
    - baby_crying
    - alarm
    - music
  min_volume: 500

# ── Face recognition — identify household members ──
face_recognition:
  enabled: true
  model_size: large
  device: GPU
  detection_threshold: 0.7
  recognition_threshold: 0.85
  min_faces: 2


# ── Global object tracking — expanded for smart home world model ──
# Indoor cameras track household objects + people + pets
# Outdoor cameras track vehicles + people + animals
objects:
  track:
    - person
    - dog
    - cat
    - car
    - motorcycle
    - bicycle
    - bus
    - backpack
    - umbrella
    - handbag
    - suitcase
    - bottle
    - cup
    - bowl
    - chair
    - couch
    - dining table
    - potted plant
    - bed
    - tv
    - laptop
    - cell phone
    - remote
    - book
    - clock
    - knife
    - fork
    - spoon
    - microwave
    - oven
    - toaster
    - refrigerator
    - sink
  filters:
    person:
      min_area: 2000
      min_score: 0.60
      threshold: 0.75
    dog:
      min_score: 0.5
      threshold: 0.65
    cat:
      min_score: 0.5
      threshold: 0.65
    car:
      min_score: 0.5
      threshold: 0.7
    bottle:
      min_score: 0.4
      threshold: 0.6
    cup:
      min_score: 0.4
      threshold: 0.6
    cell phone:
      min_score: 0.4
      threshold: 0.6
    laptop:
      min_score: 0.4
      threshold: 0.6
    chair:
      min_score: 0.3
      threshold: 0.5
    couch:
      min_score: 0.3
      threshold: 0.5

cameras:
  living_room:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/living_room
          roles: [record, audio]
        - path: rtsp://127.0.0.1:8554/living_room_sub
          roles: [detect]
    detect:
      enabled: true
      width: 960
      height: 540
      fps: 10

    objects:
      track:
        - person
        - dog
        - cat
        - bottle
        - cup
        - bowl
        - chair
        - couch
        - potted plant
        - tv
        - laptop
        - cell phone
        - remote
        - book
        - clock
        - backpack
        - handbag
        - suitcase
      filters:
        person:
          min_area: 5000
          min_score: 0.65
          threshold: 0.75

    zones:
      Front_Door:
        coordinates: 0.172,0.382,0.071,0.455,0.167,0.84,0.257,0.766
        loitering_time: 0
        inertia: 3
