name: tag desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version without the v prefix, for example 0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate and push release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          TAG="v${VERSION}"
          node tools/release/validate-desktop-release.mjs "$VERSION"
          git tag -a "$TAG" -m "Desktop release $TAG"
          git push origin "$TAG"
