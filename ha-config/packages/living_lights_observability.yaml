            {% set working_hours_present_pct = states('input_number.living_lights_working_hours_present_pct') | int(95) %}
            {# Promoted-constant reads — every literal that used to be baked
               into the template is now an input_number with a fallback to
               the original generator constant. Drag a slider, value
               propagates within ~5 s. If the helper goes missing the
               classifier degrades gracefully to the original value. #}
            {% set vacant_day_pct = states('input_number.living_lights_vacant_day_pct') | int(50) %}
            {% set vacant_night_pct = states('input_number.living_lights_vacant_night_pct') | int(20) %}
            {% set ramp_target_pct = states('input_number.living_lights_ramp_target_pct') | int(80) %}
            {% set asleep_cap_pct = states('input_number.living_lights_asleep_cap_pct') | int(30) %}
            {% set movie_dim_pct = states('input_number.living_lights_movie_dim_pct') | int(8) %}
            {% set gaming_dim_pct = states('input_number.living_lights_gaming_dim_pct') | int(3) %}
