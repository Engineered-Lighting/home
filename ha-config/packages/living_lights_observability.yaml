automation:
  - alias: "Living Lights — refresh classifier + dwell on startup"
    id: living_lights_refresh_classifiers
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/5"
    actions:
      - delay:
          seconds: 5
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.dining_room_dining_left_lighting_state
            - sensor.dining_room_dining_left_dwell
            - sensor.dining_room_dining_right_lighting_state
            - sensor.dining_room_dining_right_dwell
            - sensor.kitchen_sink_lighting_state
            - sensor.kitchen_sink_dwell
            - sensor.kitchen_island_left_lighting_state
            - sensor.kitchen_island_left_dwell
            - sensor.kitchen_island_right_lighting_state
            - sensor.kitchen_island_right_dwell
            - sensor.living_room_sofa_lighting_state
            - sensor.living_room_sofa_dwell
            - sensor.living_room_front_left_lighting_state
            - sensor.living_room_front_left_dwell
            - sensor.living_room_weights_lighting_state
            - sensor.living_room_weights_dwell
            - sensor.living_room_office_lighting_state
            - sensor.living_room_office_dwell
            - sensor.living_room_front_door_lighting_state
            - sensor.living_room_front_door_dwell
            - sensor.living_room_whole_living_room_lighting_state
            - sensor.living_room_whole_living_room_dwell
            - sensor.workshop_workshop_zone_lighting_state
            - sensor.workshop_workshop_zone_dwell
            - sensor.driveway_e28_lighting_state
            - sensor.driveway_e28_dwell
            - sensor.dining_room_whole_dining_room_lighting_state
            - sensor.dining_room_whole_dining_room_dwell
            - sensor.kitchen_whole_kitchen_lighting_state
            - sensor.kitchen_whole_kitchen_dwell
  - alias: "Living Lights — asleep ON (house quiet overnight)"
    id: living_lights_asleep_on
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.living_lights_any_occupied
        to: "off"
        for:
          minutes: 15
    conditions:
      - condition: state
        entity_id: input_boolean.living_lights_enabled
        state: "on"
      - condition: state
        entity_id: sensor.living_lights_profile
        state: overnight
      - condition: state
        entity_id: input_boolean.user_at_home
        state: "on"
      - condition: state
        entity_id: input_boolean.living_lights_asleep
        state: "off"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.living_lights_asleep
  - alias: "Living Lights — asleep OFF (genuinely up / midday backstop)"
    id: living_lights_asleep_off
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.living_lights_any_occupied
        to: "on"
        for:
          minutes: 10
      - trigger: state
        entity_id: sensor.living_lights_profile
        to: midday
      - trigger: state
        entity_id: input_boolean.user_at_home
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.living_lights_asleep
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.living_lights_asleep
  - alias: "Living Lights — articulate manual override via LLM"
    id: living_lights_articulate_override
    mode: queued
    max: 10
    triggers:
      - trigger: event
        event_type: living_lights_override_detected
    conditions:
      - condition: state
        entity_id: input_boolean.living_lights_articulate_overrides
        state: "on"
      - condition: template
        value_template: >-
          {% set zone = trigger.event.data.zone %}
          {% set last = states('input_datetime.living_lights_zone_' ~ zone ~ '_last_articulated_at') %}
          {% if last and last not in ['unknown', 'unavailable', 'none', ''] %}
            {{ (now() - as_datetime(last | string)).total_seconds() > 30 }}
          {% else %}true{% endif %}
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: "input_datetime.living_lights_zone_{{ trigger.event.data.zone }}_last_articulated_at"
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: conversation.process
        data:
          text: >-
            The user manually set the {{ trigger.event.data.zone | replace('_', ' ') }}
            light to {{ trigger.event.data.actual_pct }}%. The system was targeting
            {{ trigger.event.data.predicted_pct }}%. Context: profile is
            {{ trigger.event.data.profile }}, asleep is {{ trigger.event.data.asleep }},
            TV is {{ trigger.event.data.tv_playing }}.
            Write exactly one short acknowledgement and stop after the acknowledgement.
            Use friendly names (e.g. "the office light"), not entity IDs.
            Example good: "Okay, office light is at 30%."
            Example bad: "Want me to remember this for midday?"
        response_variable: agent_response
      - event: living_lights_articulation
        event_data:
          zone: "{{ trigger.event.data.zone }}"
          context_id: "{{ trigger.event.data.context_id }}"
          text: >-
            {{ (agent_response.response.speech.plain.speech
               | default(agent_response.speech.plain.speech, true)
               | default('Acknowledged.', true))[:200] }}
