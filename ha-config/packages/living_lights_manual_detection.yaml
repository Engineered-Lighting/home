  - alias: "Living Lights — manual touch detection (light.rear_right)"
    id: living_lights_manual_detect_rear_right
    # M19: queued (not single) so rapid slider scrubs / multi-step brightness
    # changes within the 3-s settle window don't drop the FINAL evidence with
    # "Already running" warnings. `max: 20` is the burst headroom — a normal
    # slider scrub fires 3-8 state-change events before settling; 20 covers
    # extreme bursts (Hue-app rapid dimming, RGB picker sweeps) with margin.
    # Each queued instance still respects the variables-block dedupe logic
    # (last_override_context_id flicker-count guards downstream JSONL
    # duplication), so a 20-event burst produces at most one logged
    # override_event per truly-distinct context.
    mode: queued
    max: 20
    triggers:
      - trigger: state
        entity_id: light.rear_right
        for: "00:00:03"
      - trigger: state
        entity_id: light.rear_right
        attribute: brightness
        for: "00:00:03"
      - trigger: state
        entity_id: light.rear_right
        attribute: color_temp_kelvin
        for: "00:00:03"
      - trigger: state
        entity_id: light.rear_right
        attribute: color_temp
        for: "00:00:03"
    conditions:
      - condition: state
        entity_id: input_boolean.living_lights_enabled
        state: "on"
    actions:
      - variables:
          actual_pct: >-
            {% if is_state('light.rear_right', 'on') %}
            {{ ((state_attr('light.rear_right', 'brightness') | float(0)) / 2.55) | round(0) | int }}
            {% else %}0{% endif %}
          light_state: "{{ states('light.rear_right') }}"
          match_ok: >-
            {% set ns = namespace(ok=false) %}
            {% set ap = ((state_attr('light.rear_right', 'brightness') | float(0)) / 2.55) | round(0) | int if is_state('light.rear_right', 'on') else 0 %}
            {% if not ns.ok %}
              {% set p = state_attr('sensor.living_room_weights_lighting_state', 'predicted_brightness_pct') | float(-1) %}
              {% set ri = state_attr('sensor.living_room_weights_lighting_state', 'ramp_initial_pct') | float(-1) %}
              {% set st = states('sensor.living_room_weights_lighting_state') %}
              {% if p < 0 %}{% set ns.ok = true %}
              {% elif (ap - p) | abs <= 10 %}{% set ns.ok = true %}
              {% elif st == 'present' and ri >= 0 and ap >= ([ri, p] | min - 5) and ap <= ([ri, p] | max + 5) %}{% set ns.ok = true %}
              {% endif %}
            {% endif %}
            {% if not ns.ok %}
              {% set p = state_attr('sensor.living_room_sofa_lighting_state', 'predicted_brightness_pct') | float(-1) %}
              {% set ri = state_attr('sensor.living_room_sofa_lighting_state', 'ramp_initial_pct') | float(-1) %}
              {% set st = states('sensor.living_room_sofa_lighting_state') %}
              {% if p < 0 %}{% set ns.ok = true %}
              {% elif (ap - p) | abs <= 10 %}{% set ns.ok = true %}
              {% elif st == 'present' and ri >= 0 and ap >= ([ri, p] | min - 5) and ap <= ([ri, p] | max + 5) %}{% set ns.ok = true %}
              {% endif %}
            {% endif %}
            {% if not ns.ok %}
              {% set g = state_attr('sensor.living_room_sofa_gradient', 'rear_right_pct') | float(-1) %}
              {% if g >= 0 and (ap - g) | abs <= 10 %}{% set ns.ok = true %}{% endif %}
            {% endif %}
            {{ ns.ok }}
          match_reason: >-
            {% set ns = namespace(ok=false, reason='none') %}
            {% set ap = ((state_attr('light.rear_right', 'brightness') | float(0)) / 2.55) | round(0) | int if is_state('light.rear_right', 'on') else 0 %}
            {% if not ns.ok %}
              {% set p = state_attr('sensor.living_room_weights_lighting_state', 'predicted_brightness_pct') | float(-1) %}
              {% set ri = state_attr('sensor.living_room_weights_lighting_state', 'ramp_initial_pct') | float(-1) %}
              {% set st = states('sensor.living_room_weights_lighting_state') %}
              {% if p < 0 %}{% set ns.ok = true %}{% set ns.reason = 'classifier_unavailable_weights' %}
              {% elif (ap - p) | abs <= 10 %}{% set ns.ok = true %}{% set ns.reason = 'matches_predicted_weights' %}
              {% elif st == 'present' and ri >= 0 and ap >= ([ri, p] | min - 5) and ap <= ([ri, p] | max + 5) %}{% set ns.ok = true %}{% set ns.reason = 'in_ramp_window_weights' %}
              {% endif %}
            {% endif %}
            {% if not ns.ok %}
              {% set p = state_attr('sensor.living_room_sofa_lighting_state', 'predicted_brightness_pct') | float(-1) %}
              {% set ri = state_attr('sensor.living_room_sofa_lighting_state', 'ramp_initial_pct') | float(-1) %}
              {% set st = states('sensor.living_room_sofa_lighting_state') %}
              {% if p < 0 %}{% set ns.ok = true %}{% set ns.reason = 'classifier_unavailable_sofa' %}
              {% elif (ap - p) | abs <= 10 %}{% set ns.ok = true %}{% set ns.reason = 'matches_predicted_sofa' %}
              {% elif st == 'present' and ri >= 0 and ap >= ([ri, p] | min - 5) and ap <= ([ri, p] | max + 5) %}{% set ns.ok = true %}{% set ns.reason = 'in_ramp_window_sofa' %}
              {% endif %}
            {% endif %}
            {% if not ns.ok %}
              {% set g = state_attr('sensor.living_room_sofa_gradient', 'rear_right_pct') | float(-1) %}
              {% if g >= 0 and (ap - g) | abs <= 10 %}{% set ns.ok = true %}{% set ns.reason = 'matches_sofa_gradient' %}{% endif %}
            {% endif %}
            {{ ns.reason }}
          pred_weights_state: "{{ states('sensor.living_room_weights_lighting_state') }}"
          pred_weights_p: "{{ state_attr('sensor.living_room_weights_lighting_state', 'predicted_brightness_pct') | int(0) }}"
          pred_weights_ri: "{{ state_attr('sensor.living_room_weights_lighting_state', 'ramp_initial_pct') | int(0) }}"
          pred_weights_ct: "{{ state_attr('sensor.living_room_weights_lighting_state', 'predicted_color_temp_kelvin') | int(0) }}"
          pred_sofa_state: "{{ states('sensor.living_room_sofa_lighting_state') }}"
          pred_sofa_p: "{{ state_attr('sensor.living_room_sofa_lighting_state', 'predicted_brightness_pct') | int(0) }}"
          pred_sofa_ri: "{{ state_attr('sensor.living_room_sofa_lighting_state', 'ramp_initial_pct') | int(0) }}"
