            {{ [[2000, final_ct] | max, 4000] | min }}
          dwell_ms: >
            {% set stable = states.binary_sensor.living_room_weights_person_occupancy_stable %}
            {% if stable is not none and stable.state == 'on' %}
              {{ ((now() - stable.last_changed).total_seconds() * 1000) | round(0) }}
            {% else %}0{% endif %}
          speed_mps: "{{ states('sensor.living_room_weights_avg_speed') | float(0) }}"
          last_manual_at: >
            {{ states('input_datetime.living_lights_zone_weights_last_manual_at') }}

