        entity_id: binary_sensor.living_room_office_person_occupancy_stable
        from: "on"
        to: "off"
        for: "00:15:00"
    conditions:
      # Only write the sentinel if there's actually a non-sentinel manual to expire.
      - condition: template
        value_template: >-
          {% set lm = states('input_datetime.living_lights_zone_office_last_manual_at') %}
          {% if not lm or lm in ['unknown', 'unavailable', 'none', ''] %}false
          {% else %}
            {% set manual_dt = as_datetime(lm | string) %}
            {{ manual_dt.year >= 2000 }}
          {% endif %}
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.living_lights_zone_office_last_manual_at
        data:
          datetime: "1970-01-01 00:00:00"

