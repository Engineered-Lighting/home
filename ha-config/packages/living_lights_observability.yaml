            {% set night = is_state('binary_sensor.living_lights_is_night_safe', 'on') %}
            {% set asleep = is_state('input_boolean.living_lights_asleep', 'on') %}
            {% set tv_playing = states('media_player.lg_tv') not in ['off', 'unavailable', 'unknown'] %}
