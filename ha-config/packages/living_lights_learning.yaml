          actual_ct: "{{ state_attr('binary_sensor.living_lights_front_door_deviation', 'actual_color_temp_kelvin') | int(0) }}"
          predicted_bri: "{{ state_attr('binary_sensor.living_lights_front_door_deviation', 'predicted_brightness_pct') | int(0) }}"
          predicted_ct: "{{ state_attr('binary_sensor.living_lights_front_door_deviation', 'predicted_color_temp_kelvin') | int(0) }}"
