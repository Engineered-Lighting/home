# Home Agent database authentication boundary. This file is selected with
# PostgreSQL's hba_file setting so existing clusters cannot retain an older
# initdb-generated local-trust rule after an upgrade.
local  home_agent  home_agent_identity_cutover        scram-sha-256
local  all         home_agent_identity_cutover        reject
host   home_agent  home_agent_identity_cutover  0.0.0.0/0  scram-sha-256
host   all         home_agent_identity_cutover  0.0.0.0/0  reject
host   home_agent  home_agent_identity_cutover  ::/0       scram-sha-256
host   all         home_agent_identity_cutover  ::/0       reject
local  home_agent  home_agent_backup                  scram-sha-256
local  all         home_agent_backup                  reject
host   home_agent  home_agent_backup  0.0.0.0/0       scram-sha-256
host   all         home_agent_backup  0.0.0.0/0       reject
host   home_agent  home_agent_backup  ::/0            scram-sha-256
host   all         home_agent_backup  ::/0            reject
local  all         all                                scram-sha-256
host   all         all                0.0.0.0/0       scram-sha-256
host   all         all                ::/0            scram-sha-256
