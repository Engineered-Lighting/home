        state: >
          {% set manual = is_state('input_boolean.living_lights_override_dining_left', 'on') %}
          {% set away = is_state('input_boolean.user_at_home', 'off') %}
          {% set override_raw = states('input_text.living_lights_override_text_dining_left') %}
          {% set has_override = override_raw not in ['', 'unknown', 'unavailable', None] %}
          {% set night = is_state('binary_sensor.living_lights_is_night_safe', 'on') %}
          {% set stable_obj = states.binary_sensor.dining_room_dining_left_person_occupancy_stable %}
          {% set stable = states('binary_sensor.dining_room_dining_left_person_occupancy_stable') %}
          {% set raw_obj = states.binary_sensor.dining_left_person_occupancy %}
          {% set raw_state = states('binary_sensor.dining_left_person_occupancy') %}
          {% set t_end = raw_obj.last_changed if (raw_obj is not none and raw_state == 'off') else now() %}
          {% set dwell = ((t_end - stable_obj.last_changed).total_seconds() * 1000) | round(0) if (stable_obj is not none and stable == 'on') else 0 %}
          {% set speed = states('sensor.dining_room_dining_left_avg_speed') | float(0) %}
