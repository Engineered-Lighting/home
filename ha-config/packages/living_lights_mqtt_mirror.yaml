# living_lights_mqtt_mirror.yaml - GENERATED by tools/build-living-lights-yaml.py --mirror-output
#
# DO NOT EDIT BY HAND. Edit MIRROR_ENTITIES / MIRROR_ATTRIBUTE_SUBSET in
# build-living-lights-yaml.py and re-run with --mirror-output to regenerate.
#
# Mirrors the Home Assistant state the lighting belief publisher needs onto
# the LOCAL Mosquitto broker as retained JSON, so the publisher runs with no
# Home Assistant token: one topic per entity,
#   living_lights/mirror/<entity_id with dots replaced by slashes>
#   payload {entity_id, state, changed_at (ISO), attributes (subset)}
# republished on every state change, at Home Assistant start and once a
# minute, plus living_lights/mirror/heartbeat (the ISO time, once a minute)
# so the publisher can tell a silent broker from a silent house.
# Nothing here leaves the house: mqtt.publish only, no other action.
#
# Rollback: remove this file + reload automations; clear the retained topics
# with `mosquitto_pub -r -n -t <topic>` if a stale mirror must not linger.

automation:
  - alias: "Living Lights - MQTT mirror on state change"
    id: living_lights_mqtt_mirror_change
    mode: queued
    max: 50
    triggers:
      - trigger: state
        entity_id:
          - media_player.lg_tv
          - input_boolean.user_at_home
          - input_boolean.living_lights_asleep
          - sensor.living_lights_profile
          - input_boolean.living_lights_actuate_from_belief_changes
          - input_boolean.living_lights_typesafe_egress_enabled
          - input_boolean.living_lights_asleep_from_estimator
          - input_text.living_lights_zone_dining_left_last_command_id
          - input_text.living_lights_zone_dining_right_last_command_id
          - input_text.living_lights_zone_front_door_last_command_id
          - input_text.living_lights_zone_front_left_last_command_id
          - input_text.living_lights_zone_island_left_last_command_id
          - input_text.living_lights_zone_island_right_last_command_id
          - input_text.living_lights_zone_office_last_command_id
          - input_text.living_lights_zone_sink_last_command_id
          - input_text.living_lights_zone_sofa_last_command_id
          - input_text.living_lights_zone_weights_last_command_id
        to:
    actions:
      - action: mqtt.publish
        data:
          topic: "living_lights/mirror/{{ trigger.entity_id | replace('.', '/') }}"
          retain: true
          payload: >-
            {% set obj = trigger.to_state %}{% set subset = {'media_player.lg_tv': ['source', 'media_title', 'media_content_type'], 'sensor.living_lights_profile': ['tod_factor', 'max_brightness_pct', 'tod_color_warm']} %}{% set ns = namespace(attrs={}) %}{% for key in subset.get(obj.entity_id, []) %}{% if key in obj.attributes %}{% set ns.attrs = dict(ns.attrs, **{key: obj.attributes[key]}) %}{% endif %}{% endfor %}{{ {'entity_id': obj.entity_id, 'state': obj.state, 'changed_at': obj.last_changed.isoformat(), 'attributes': ns.attrs} | to_json }}
  - alias: "Living Lights - MQTT mirror republish and heartbeat"
    id: living_lights_mqtt_mirror_republish
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
    actions:
      - repeat:
          for_each: >-
            {{ expand([
                'media_player.lg_tv',
                'input_boolean.user_at_home',
                'input_boolean.living_lights_asleep',
                'sensor.living_lights_profile',
                'input_boolean.living_lights_actuate_from_belief_changes',
                'input_boolean.living_lights_typesafe_egress_enabled',
                'input_boolean.living_lights_asleep_from_estimator',
                'input_text.living_lights_zone_dining_left_last_command_id',
                'input_text.living_lights_zone_dining_right_last_command_id',
                'input_text.living_lights_zone_front_door_last_command_id',
                'input_text.living_lights_zone_front_left_last_command_id',
                'input_text.living_lights_zone_island_left_last_command_id',
                'input_text.living_lights_zone_island_right_last_command_id',
                'input_text.living_lights_zone_office_last_command_id',
                'input_text.living_lights_zone_sink_last_command_id',
                'input_text.living_lights_zone_sofa_last_command_id',
                'input_text.living_lights_zone_weights_last_command_id',
              ]) | map(attribute='entity_id') | list }}
          sequence:
            - action: mqtt.publish
              data:
                topic: "living_lights/mirror/{{ repeat.item | replace('.', '/') }}"
                retain: true
                payload: >-
                  {% set obj = expand([repeat.item]) | first %}{% set subset = {'media_player.lg_tv': ['source', 'media_title', 'media_content_type'], 'sensor.living_lights_profile': ['tod_factor', 'max_brightness_pct', 'tod_color_warm']} %}{% set ns = namespace(attrs={}) %}{% for key in subset.get(obj.entity_id, []) %}{% if key in obj.attributes %}{% set ns.attrs = dict(ns.attrs, **{key: obj.attributes[key]}) %}{% endif %}{% endfor %}{{ {'entity_id': obj.entity_id, 'state': obj.state, 'changed_at': obj.last_changed.isoformat(), 'attributes': ns.attrs} | to_json }}
      - action: mqtt.publish
        data:
          topic: "living_lights/mirror/heartbeat"
          retain: true
          payload: "{{ now().isoformat() }}"
