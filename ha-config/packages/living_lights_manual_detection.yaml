          ctx_id: "ovr-{{ now().timestamp() | int }}-{{ now().microsecond }}"
      - if:
          - condition: template
            value_template: "{{ match_ok != true and match_ok != 'true' }}"
        then:
          - action: input_datetime.set_datetime
            target:
