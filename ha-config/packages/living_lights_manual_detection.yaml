          to_bri_pct: >-
            {% if to_state_s == 'off' %}0
            {% elif to_bri_raw not in [none, '', 'unknown', 'unavailable', 'none', 'None'] %}{{ ((to_bri_raw | float(0)) / 2.55) | round(0) | int }}
            {% else %}{{ none }}{% endif %}
