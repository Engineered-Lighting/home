          console.info('[boot] chain complete — ' + boot.loaded + '/' + boot.total +
            ' files, sw ' + swVersionLabel() +
            (boot.skipped && boot.skipped.length ? ', skipped ' + boot.skipped.length : ''));
          if (window.__homePerf) window.__homePerf.mark('boot:complete', {
            loaded: boot.loaded,
            total: boot.total,
            skipped: boot.skipped || [],
            lazyFeaturesEnabled: lazyFeaturesEnabled,
          });
          return;
        }
        var name = files[i][0];
        var isBabel = files[i][1];
        boot.current = name;
        updateBootShell('fetching', name);
        var fetchStart = performance.now ? performance.now() : Date.now();
        fetchBootText(i).then(function (text) {
          if (window.__homePerf) {
            window.__homePerf.recordBootFile(name, 'fetch',
              (performance.now ? performance.now() : Date.now()) - fetchStart);
          }
          var code = text;
          if (isBabel) {
            try {
              updateBootShell('transforming', name);
              var transformStart = performance.now ? performance.now() : Date.now();
              code = Babel.transform(text, {
                filename: name,
                presets: ['react', 'env'],
                plugins: BABEL_PLUGINS,
                sourceMaps: 'inline',
                sourceFileName: name,
              }).code;
              if (window.__homePerf) {
                window.__homePerf.recordBootFile(name, 'transform',
                  (performance.now ? performance.now() : Date.now()) - transformStart);
              }
            } catch (err) {
              if (skipOptionalWebFile(name, err, i)) return;
              // A transform error is usually a real syntax fault — but a
              // truncated fetch (flaky Tailscale) is indistinguishable. Re-fetch
              // a few times before declaring the chain dead.
              babelFailures[name] = (babelFailures[name] || 0) + 1;
              if (babelFailures[name] <= 3) { scheduleBootRetry(i, err); return; }
              boot.reconnecting = false;
              boot.failed = name;
              overlay('Babel transform failed in ' + name +
                ' — boot chain stopped (downstream files depend on it)',
                String((err && err.message) || err));
              return;
            }
          }
          if (boot.reconnecting) { boot.reconnecting = false; removeOverlay(); }
          updateBootShell('executing', name);
          var executeStart = performance.now ? performance.now() : Date.now();
          execute(name, code);
          if (window.__homePerf) {
            window.__homePerf.recordBootFile(name, 'execute',
              (performance.now ? performance.now() : Date.now()) - executeStart);
          }
          boot.loaded++;
          updateBootShell('executing', name);
          primeWindow(i + 1);
          step(i + 1);
        }).catch(function (err) {
          if (skipOptionalWebFile(name, err, i)) return;
          // Network failure (status 0 / timeout / abort) — the AI-box reboot
          // window. Never a dead end: keep retrying with backoff so the app
          // self-heals when the box returns, and offer a manual escape hatch.
          scheduleBootRetry(i, err);
        });
      }
      console.info('[boot] starting chain — sw ' + swVersionLabel() + ', ' +
        files.length + ' files' + (lazyFeaturesEnabled ? ' (' + (originalFileCount - files.length) + ' deferred)' : ''));
      primeWindow(0);
      step(0);

      /* Mount watchdog. Lives HERE, not in home-mount.jsx: the failure mode
         it guards against is home-mount.jsx itself never executing, in which
         case any watchdog defined there would not exist either. */
      var mountRetries = 0;
      var lastLoaded = -1;
      var lastProgressAt = Date.now();
      function watchdog() {
        var root = document.getElementById('root');
        if (root && root.children.length > 0) return; /* mounted — done */
        if (boot.failed) return; /* overlay already explains it */
        if (!boot.done) {
          if (boot.reconnecting) { setTimeout(watchdog, 2000); return; } /* actively retrying */
          if (boot.loaded !== lastLoaded) {
            lastLoaded = boot.loaded;
            lastProgressAt = Date.now();
          } else if (Date.now() - lastProgressAt > 90000) {
            updateBootShell('stalled', boot.current || 'mount');
            overlay('Boot chain stalled at ' + boot.current,
              boot.loaded + '/' + boot.total + ' files executed');
            return;
          }
          setTimeout(watchdog, 2000);
          return;
        }
        if (typeof window.__homeMount === 'function' && mountRetries < 3) {
          mountRetries++;
          console.warn('[boot] #root empty after boot chain — retrying mount (' +
            mountRetries + '/3)');
          try { window.__homeMount(); } catch (e) { console.error('[boot] mount retry threw', e); }
          setTimeout(watchdog, 2000);
          return;
        }
        overlay('Boot chain completed but the app did not mount',
          'files: ' + boot.loaded + '/' + boot.total +
          ' · typeof HomeApp: ' + typeof window.HomeApp +
          ' · typeof __homeMount: ' + typeof window.__homeMount +
          ' · mount retries: ' + mountRetries +
          '\nIf a component crashed during render, the error is in the console above.');
      }
      setTimeout(watchdog, 2000);
    })();
  </script>
</body>
</html>
