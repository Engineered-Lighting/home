worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  access_log /dev/stdout combined;
  server_tokens off;

  server {
    listen 8443 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/secrets/server.crt;
    ssl_certificate_key /run/secrets/server.key;
    ssl_client_certificate /run/secrets/client-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    client_max_body_size 8m;

    location = /v1/ingest/envelopes {
      limit_except POST { deny all; }
      proxy_pass http://core-ingest:8104;
      proxy_http_version 1.1;
      proxy_set_header Host core-ingest;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
    }

    location = /v1/ingest/privacy-policy {
      # The Edge must obtain Core's current ingress privacy blocklist before
      # it subscribes to HA events. Keep this a read-only, exact-path surface;
      # mTLS authenticates the Edge and Core still validates its bearer.
      if ($request_method != GET) { return 405; }
      proxy_pass http://core-ingest:8104;
      proxy_http_version 1.1;
      proxy_set_header Host core-ingest;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
    }

    # ---- People tab: household reads ---------------------------------------
    # Home Assistant already authenticates to this listener with a client
    # certificate for telemetry. These four locations reuse that door so the
    # People tab keeps its existing transport and only its data source changes.
    # Exact paths only; a query string is refused rather than forwarded,
    # matching the BFF, which rejects any search on these routes.
    location = /v1/household {
      limit_except GET { deny all; }
      if ($is_args) { return 400; }
      proxy_pass http://core-api:8104;
      proxy_http_version 1.1;
      proxy_set_header Host core-api;
      # Core's service credential, injected here so it never leaves this host.
      # That token can impersonate any user to Core, so mTLS is what
      # authenticates the caller; this only says the request arrived through a
      # trusted front.
      include /run/secrets/core-auth.conf;
      # Home Assistant knows the acting user first-hand, so it asserts them.
      proxy_set_header X-Authenticated-HA-User $http_x_authenticated_ha_user;
      # Blanked so a request arriving here can never satisfy Core's native
      # service identity, whatever a future location might allow.
      proxy_set_header X-Home-Agent-Channel "";
      proxy_set_header X-Home-Agent-Installation "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
    }

    location = /v1/relationships {
      limit_except GET { deny all; }
      if ($is_args) { return 400; }
      proxy_pass http://core-api:8104;
      proxy_http_version 1.1;
      proxy_set_header Host core-api;
      include /run/secrets/core-auth.conf;
      proxy_set_header X-Authenticated-HA-User $http_x_authenticated_ha_user;
      proxy_set_header X-Home-Agent-Channel "";
      proxy_set_header X-Home-Agent-Installation "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
    }

    # ---- People tab: household writes --------------------------------------
    # Adding a person and recording a relationship both run through kernels
    # that re-derive their own authority and refuse anything they were not
    # given, so nginx bounds the surface and Core still decides whether the act
    # is permitted.
    location = /v1/household-person {
      limit_except POST { deny all; }
      if ($is_args) { return 400; }
      proxy_pass http://core-api:8104;
      proxy_http_version 1.1;
      proxy_set_header Host core-api;
      include /run/secrets/core-auth.conf;
      proxy_set_header X-Authenticated-HA-User $http_x_authenticated_ha_user;
      proxy_set_header X-Home-Agent-Channel "";
      proxy_set_header X-Home-Agent-Installation "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
    }

    location = /v1/partner-attestation {
      limit_except POST { deny all; }
      if ($is_args) { return 400; }
      proxy_pass http://core-api:8104;
      proxy_http_version 1.1;
      proxy_set_header Host core-api;
      include /run/secrets/core-auth.conf;
      proxy_set_header X-Authenticated-HA-User $http_x_authenticated_ha_user;
      proxy_set_header X-Home-Agent-Channel "";
      proxy_set_header X-Home-Agent-Installation "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
    }

    location / { return 404; }
  }
}
