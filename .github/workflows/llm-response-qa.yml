name: llm response qa

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell_contracts:
    name: chat and full-shell contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for authored Apartment acceptance
        run: npx playwright install --with-deps chromium

      - name: Chat de-duplication contracts
        run: node tools/run-chat-dedupe-tests.js

      - name: Workflow scenario contracts
        run: python3 tools/test-workflow-scenarios.py

      - name: Browser transcript static regression
        run: node tools/run-chat-ui-regression.js

      - name: App-shell smoke
        run: node tools/qa-browser-smoke.js

      - name: UI QA workflow contracts
        run: node --test tools/test-ui-qa-workflow.mjs

      - name: Authored Apartment shell browser acceptance
        run: node --test tools/test-apartment-home-shell-browser.mjs

      - name: Retain authored shell diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apartment-shell-authored-browser
          path: |
            .tmp/apartment-home-shell-browser/run-*/*receipt.json
            .tmp/apartment-home-shell-browser/run-*/*.png
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  touched_contracts:
    name: touched-surface contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the touched-harness job can diff against the base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for authored Apartment acceptance
        run: npx playwright install --with-deps chromium

      - name: Touched-surface harnesses
        if: github.event_name == 'pull_request'
        run: node tools/run-touched-harnesses.mjs --base "origin/${{ github.base_ref }}"

      - name: Retain authored touched-surface diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apartment-touched-authored-browser
          path: |
            .tmp/apartment-overlay-bridge-browser/run-*/receipt.json
            .tmp/apartment-room-selection-browser/run-*/receipt.json
            .tmp/apartment-room-inspector-browser/run-*/receipt.json
            .tmp/apartment-directional-browser/run-*/receipt.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  deterministic:
    name: deterministic chat and ui contracts
    needs: [shell_contracts, touched_contracts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Require both independent suites
        env:
          SHELL_RESULT: ${{ needs.shell_contracts.result }}
          TOUCHED_RESULT: ${{ needs.touched_contracts.result }}
        run: |
          test "$SHELL_RESULT" = success && test "$TOUCHED_RESULT" = success
