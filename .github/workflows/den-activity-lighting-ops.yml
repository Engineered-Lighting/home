name: den activity lighting ops

# Offline tests for the always-on ops pieces (AL-5): the monitor, the soak
# criteria, the unit templates and the brain health check. The monitor is
# standard-library Python that runs on Python 3.10 (Victoria Jetson) and
# 3.12 (LA host), so the suite runs on both. The gateway routes are tested by
# tools/run-web-gateway-lighting-brain-tests.mjs in home-agent-web-boundary.yml.

on:
  pull_request:
    paths:
      - ".github/workflows/den-activity-lighting-ops.yml"
      - "stack/ops/den-activity-lighting/**"
      - "tools/shared-home/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/den-activity-lighting-ops.yml"
      - "stack/ops/den-activity-lighting/**"
      - "tools/shared-home/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-activity-lighting-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor-tests:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 ships Python 3.10 (the Jetson's), ubuntu-24.04 ships 3.12.
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      # actions/checkout v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install the hash-pinned test packages
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv "${RUNNER_TEMP}/den-ops"
          "${RUNNER_TEMP}/den-ops/bin/python" -m pip install \
            --no-cache-dir \
            --disable-pip-version-check \
            --require-hashes \
            --no-deps \
            -r stack/ops/den-activity-lighting/monitor/requirements-test.lock

      - name: Run the monitor, soak and unit tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        working-directory: stack/ops/den-activity-lighting/monitor
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/den-ops/bin/python" -m pytest -p no:cacheprovider -q tests

  inference-health-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install hash-pinned synthetic-image fixture dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/den-inference-health"
          "${RUNNER_TEMP}/den-inference-health/bin/python" -m pip install --no-cache-dir --disable-pip-version-check --require-hashes --no-deps -r tools/shared-home/requirements-test.lock
      - name: Verify Den inference health and model boundaries offline
        working-directory: tools/shared-home/tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          export PYTHONPATH="${GITHUB_WORKSPACE}/tools/shared-home"
          "${RUNNER_TEMP}/den-inference-health/bin/python" -B -m unittest test_pilot_health test_model_pin test_camera_pilot_service test_lab_live_guards test_lab_live_pilot test_lab_live_scene -q
