name: home agent E1/E2/E3 PostgreSQL gate

on:
  pull_request:
    paths:
      - ".github/workflows/home-agent-e1-postgres.yml"
      - "stack/home-agent.env.example"
      - "stack/home-agent-compose.yml"
      - "stack/home-agent-deploy/apply-grants.sh"
      - "stack/home-agent-deploy/identity-api-acl.sql"
      - "stack/home-agent-deploy/operator/REVIEWED-IDENTITY-PAYLOAD.md"
      - "stack/home-agent-deploy/operator/reviewed_identity_payload.py"
      - "stack/home-agent-deploy/provision-roles.sh"
      - "stack/services/home-agent-core/**"
      - "tests/home_agent/test_apply_grants_revision_0006a_contract.py"
      - "tests/home_agent/test_e1_postgres_gate_contract.py"
      - "tests/home_agent/test_identity_erasure_kernel_foundation_deployment_contract.py"
      - "tests/home_agent/test_identity_finalizer_e3_deployment_contract.py"
      - "tests/home_agent/test_identity_finalizer_foundation_deployment_contract.py"
      - "tools/run-home-agent-e1-postgres-gate.py"
  push:
    # Keep the exact integration branch on GitHub-hosted runners until the
    # repository integration regains permission to open the draft PR.
    branches: [main, codex/home-agent-integration]
    paths:
      - ".github/workflows/home-agent-e1-postgres.yml"
      - "stack/home-agent.env.example"
      - "stack/home-agent-compose.yml"
      - "stack/home-agent-deploy/apply-grants.sh"
      - "stack/home-agent-deploy/identity-api-acl.sql"
      - "stack/home-agent-deploy/operator/REVIEWED-IDENTITY-PAYLOAD.md"
      - "stack/home-agent-deploy/operator/reviewed_identity_payload.py"
      - "stack/home-agent-deploy/provision-roles.sh"
      - "stack/services/home-agent-core/**"
      - "tests/home_agent/test_apply_grants_revision_0006a_contract.py"
      - "tests/home_agent/test_e1_postgres_gate_contract.py"
      - "tests/home_agent/test_identity_erasure_kernel_foundation_deployment_contract.py"
      - "tests/home_agent/test_identity_finalizer_e3_deployment_contract.py"
      - "tests/home_agent/test_identity_finalizer_foundation_deployment_contract.py"
      - "tools/run-home-agent-e1-postgres-gate.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-agent-e1-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  erasure-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # actions/checkout v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run isolated PostgreSQL 17 E1/E2/E3 authority gate
        env:
          HOME_AGENT_E1_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: >-
          python3 tools/run-home-agent-e1-postgres-gate.py
          --github-hosted-linux
