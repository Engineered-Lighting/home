worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  access_log /dev/stdout combined;
  server_tokens off;

  server {
    listen 8443 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/secrets/server.crt;
    ssl_certificate_key /run/secrets/server.key;
    ssl_client_certificate /run/secrets/client-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    client_max_body_size 8m;

    location = /v1/ingest/envelopes {
      limit_except POST { deny all; }
      proxy_pass http://core-ingest:8104;
      proxy_http_version 1.1;
      proxy_set_header Host core-ingest;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
    }

    location = /v1/ingest/privacy-policy {
      # The Edge must obtain Core's current ingress privacy blocklist before
      # it subscribes to HA events. Keep this a read-only, exact-path surface;
      # mTLS authenticates the Edge and Core still validates its bearer.
      if ($request_method != GET) { return 405; }
      proxy_pass http://core-ingest:8104;
      proxy_http_version 1.1;
      proxy_set_header Host core-ingest;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
    }

    location / { return 404; }
  }
}
