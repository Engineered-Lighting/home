[package]
name = "home"
version = "0.1.0"
description = "Local AI chat client for Home Assistant"
authors = ["Engineered Lighting"]
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools feature is enabled here so right-click → Inspect works on the
# production .msi too. Trivial size overhead (~200 KB), worth it for debug.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
# Single-instance plugin: prevents a second home.exe from creating a
# second window. Second launch focuses the existing window instead.
# Avoids "two app windows fighting over MJPEG TCP connections to HA".
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
