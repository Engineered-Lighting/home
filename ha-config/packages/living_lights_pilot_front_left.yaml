# living_lights_pilot_front_left.yaml — GENERATED by tools/build-living-lights-actuators.py
#
# Actuator pilot for zone "front_left" (camera=living_room).
# Triggers on sensor.living_room_front_left_lighting_state.
# Targets: ['light.front_left']
#
# Layer 2 — the confidence ramp. mode:restart so the ramp is interruptible.
#
# INERT until all 3 master toggles ON:
#   input_boolean.living_lights_enabled = on
#   input_boolean.living_lights_shadow = off
#   input_boolean.living_lights_zone_front_left_enabled = on
#
# Rollback: delete this file + reload automations.

automation:
  - alias: "Living Lights — front_left actuator"
    id: living_lights_actuator_front_left
    description: >
      Actuates ['light.front_left'] from sensor.living_room_front_left_lighting_state via the confidence ramp.
      Inert until all 3 master toggles ON.
    mode: restart
    triggers:
      # occupancy state changes (vacant / present / pass_through / away ...)
      - trigger: state
        entity_id: sensor.living_room_front_left_lighting_state
      # target-brightness changes — the movie / asleep / time-of-day
      # modifiers move predicted_brightness_pct without changing the state.
      - trigger: state
        entity_id: sensor.living_room_front_left_lighting_state
        attribute: predicted_brightness_pct
      # cutover — apply the current target the instant shadow mode goes off.
      - trigger: state
        entity_id: input_boolean.living_lights_shadow
        to: "off"
      # Periodic re-evaluation so cooldown-expiry isn't gated on a presence
      # event. The pilot is mode:restart and exits early when no work is to
      # be done; re-evaluation is cheap.
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: input_boolean.living_lights_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.living_lights_shadow
        state: "off"
      - condition: state
        entity_id: input_boolean.living_lights_zone_front_left_enabled
        state: "on"
      # Manual-touch cooldown gate (R5-aligned). Reads input_datetime directly
      # to avoid the 5-s classifier-attribute lag.
      #   - cooldown applies ONLY to states {vacant, present, pass_through}.
      #     Explicit/override states (away, presence_override, manual_override,
      #     night_safe, anticipated) and asleep ALWAYS bypass.
      #   - sentinel year < 2000 (e.g., 1970-01-01) means the vacancy-expire
      #     or voice-override-reset automation cleared the manual.
      #   - in-zone + non-expired manual → block (manual sticks while in zone).
      #   - out-of-zone → respect 15 min from MAX(manual_dt, zone-leave-time).
      - condition: template
        value_template: >-
          {% set state = states('sensor.living_room_front_left_lighting_state') %}
          {% set asleep = is_state('input_boolean.living_lights_asleep', 'on') %}
          {% if state not in ['vacant', 'present', 'pass_through'] or asleep %}true
          {% else %}
            {% set lm = states('input_datetime.living_lights_zone_front_left_last_manual_at') %}
            {% if not lm or lm in ['unknown', 'unavailable', 'none', ''] %}true
            {% else %}
              {# input_datetime renders as a naive string; as_local attaches the local tz so
                 the comparisons below against last_changed (UTC-aware) and now() (local-aware)
                 don't raise TypeError: can't compare offset-naive and offset-aware datetimes. #}
              {% set manual_dt = as_datetime(lm | string) | as_local %}
              {% if manual_dt.year < 2000 %}true
              {% else %}
                {% set stable_obj = states.binary_sensor.living_room_front_left_person_occupancy_stable %}
                {% if stable_obj is none %}true
                {% elif stable_obj.state == 'on' %}false
                {% else %}
                  {% set leave_time = stable_obj.last_changed %}
                  {{ (now() - ([manual_dt, leave_time] | max)).total_seconds() > 900 }}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endif %}
    actions:
      - variables:
          # Read the classifier state directly — not trigger.to_state — so the
          # pilot is correct whichever trigger fired (state / attribute / shadow).
          new_state: "{{ states('sensor.living_room_front_left_lighting_state') }}"
          predicted_bri: "{{ state_attr('sensor.living_room_front_left_lighting_state', 'predicted_brightness_pct') | int(0) }}"
          ramp_initial: "{{ state_attr('sensor.living_room_front_left_lighting_state', 'ramp_initial_pct') | int(0) }}"
          safe_initial: "{{ [ramp_initial, predicted_bri] | min }}"
      - if:
          - condition: template
            value_template: "{{ new_state not in ['manual_override', 'unknown', 'unavailable'] }}"
        then:
          - choose:
              # vacant — ease down to the idle baseline (per-entity, with
              # co-controller guards; turn_off when the floor is 0).
              - conditions:
                  - condition: template
                    value_template: "{{ new_state == 'vacant' }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: >-
                          {% set ns = namespace(any_active=false) %}
                          {% if states('sensor.living_room_sofa_lighting_state') != 'vacant' %}{% set ns.any_active = true %}{% endif %}
                          {{ not ns.any_active }}
                    then:
                      - if:
                          - condition: template
                            value_template: "{{ predicted_bri > 0 }}"
                        then:
                          - action: light.turn_on
                            target:
                              entity_id: light.front_left
                            data:
                              brightness_pct: "{{ [predicted_bri, 1] | max }}"
                              color_temp_kelvin: "{{ state_attr('sensor.living_room_front_left_lighting_state', 'predicted_color_temp_kelvin') | int(state_attr('switch.home_adaptive_lighting_home', 'color_temp_kelvin') | int(2700)) }}"
                              transition: 6.0
                        else:
                          - action: light.turn_off
                            target:
                              entity_id: light.front_left
                            data:
                              transition: 6.0
              # away — turn every target off.
              - conditions:
                  - condition: template
                    value_template: "{{ new_state == 'away' }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: light.front_left
                    data:
                      transition: 2.0
              # presence_override — apply the override JSON brightness.
              - conditions:
                  - condition: template
                    value_template: "{{ new_state == 'presence_override' }}"
                sequence:
                  - variables:
                      ov_text: "{{ states('input_text.living_lights_override_text_front_left') }}"
                      ov_obj: "{{ ov_text | from_json if ov_text else {} }}"
                      ov_bri: "{{ ov_obj.get('brightness_pct', 50) | int(50) }}"
                  - action: light.turn_on
                    target:
                      entity_id: light.front_left
                    data:
                      brightness_pct: "{{ [ov_bri, 1] | max }}"
                      color_temp_kelvin: "{{ state_attr('sensor.living_room_front_left_lighting_state', 'predicted_color_temp_kelvin') | int(state_attr('switch.home_adaptive_lighting_home', 'color_temp_kelvin') | int(2700)) }}"
                      transition: 0.8
              # present — the confidence ramp (fast reaction, then slow ramp).
              - conditions:
                  - condition: template
                    value_template: "{{ new_state == 'present' }}"
                sequence:
                  - variables:
                      zone_max_bri: "{{ [(state_attr('light.front_left', 'brightness') | float(0)) / 2.55] | max }}"
                  - if:
                      - condition: template
                        value_template: "{{ zone_max_bri < safe_initial }}"
                    then:
                      - action: light.turn_on
                        target:
                          entity_id: light.front_left
                        data:
                          brightness_pct: "{{ [safe_initial, 1] | max }}"
                          color_temp_kelvin: "{{ state_attr('sensor.living_room_front_left_lighting_state', 'predicted_color_temp_kelvin') | int(state_attr('switch.home_adaptive_lighting_home', 'color_temp_kelvin') | int(2700)) }}"
                          transition: 2.0
                      - delay:
                          seconds: 2.0
                  - action: light.turn_on
                    target:
                      entity_id: light.front_left
                    data:
                      brightness_pct: "{{ [predicted_bri, 1] | max }}"
                      color_temp_kelvin: "{{ state_attr('sensor.living_room_front_left_lighting_state', 'predicted_color_temp_kelvin') | int(state_attr('switch.home_adaptive_lighting_home', 'color_temp_kelvin') | int(2700)) }}"
                      transition: 10.0
              # pass_through — a quick path light (raises only).
              - conditions:
                  - condition: template
                    value_template: "{{ new_state == 'pass_through' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: light.front_left
                    data:
                      brightness_pct: "{{ [predicted_bri, (state_attr('light.front_left', 'brightness') | float(0)) / 2.55] | max | round(0) | int }}"
                      color_temp_kelvin: "{{ state_attr('sensor.living_room_front_left_lighting_state', 'predicted_color_temp_kelvin') | int(state_attr('switch.home_adaptive_lighting_home', 'color_temp_kelvin') | int(2700)) }}"
                      transition: 0.3
              # anticipated — pre-warm for a person walking TOWARD this room
              # (Phase 4). Raises only (never dims a light already brighter)
              # over a 1.5 s perceptual ramp. The classifier-side kill switch
              # input_boolean.living_lights_anticipated_enabled prevents this
              # branch from ever being selected when OFF (the state stays at
              # `vacant`), so no separate gate is needed here.
              - conditions:
                  - condition: template
                    value_template: "{{ new_state == 'anticipated' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: light.front_left
                    data:
                      brightness_pct: "{{ [predicted_bri, (state_attr('light.front_left', 'brightness') | float(0)) / 2.55] | max | round(0) | int }}"
                      color_temp_kelvin: "{{ state_attr('sensor.living_room_front_left_lighting_state', 'predicted_color_temp_kelvin') | int(state_attr('switch.home_adaptive_lighting_home', 'color_temp_kelvin') | int(2700)) }}"
                      transition: 1.5
            # default — night_safe and any other non-vacant state.
            default:
              - action: light.turn_on
                target:
                  entity_id: light.front_left
                data:
                  brightness_pct: "{{ [predicted_bri, 1] | max }}"
                  color_temp_kelvin: "{{ state_attr('sensor.living_room_front_left_lighting_state', 'predicted_color_temp_kelvin') | int(state_attr('switch.home_adaptive_lighting_home', 'color_temp_kelvin') | int(2700)) }}"
                  transition: 1.5
