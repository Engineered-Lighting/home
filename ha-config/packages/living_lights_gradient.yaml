# living_lights_gradient.yaml — GENERATED by tools/build-gradient-lighting.py
#
# Phase 3 gradient lighting for the "sofa" zone (camera=living_room). As the
# person moves on the sofa, the near light stays bright and the far lights
# dim — per-light brightness from each light's hand-drawn footprint centroid
# (baked below) and the person's live position.
#
# ADDITIVE — layered over the existing sofa pilot, touches no other file.
# INERT until all of:
#   input_boolean.living_lights_enabled = on
#   input_boolean.living_lights_shadow  = off
#   input_boolean.living_lights_zone_sofa_enabled = on
#
# Baked footprint centroids (normalised [0,1], from spatial_model.json):
#   light.front_left: [0.359, 0.896]
#   light.front_right: [0.233, 0.581]
#   light.rear_left: [0.807, 0.488]
#   light.rear_right: [0.489, 0.368]
#
# Rollback: delete this file + reload HA.

input_number:
  living_lights_gradient_lambda:
    name: Living Lights gradient lambda
    icon: mdi:blur
    min: 0.1
    max: 1.5
    step: 0.05
    initial: 0.6
  living_lights_gradient_floor:
    name: Living Lights gradient floor
    icon: mdi:arrow-collapse-down
    min: 0.1
    max: 1.0
    step: 0.05
    initial: 0.4

# Layer 3 gate — the gradient stays OFF until this is explicitly turned on,
# so activating Living Lights does not also activate the (not yet
# shadow-reviewed) sofa gradient. Default-off.
input_boolean:
  living_lights_gradient_enabled:
    name: "Living Lights — gradient enabled (Layer 3)"
    icon: mdi:gradient-vertical

mqtt:
  sensor:
    # Person foot-position on the living_room camera, normalised [0,1].
    # Frigate box is [x_min, y_min, x_max, y_max] in detect pixels
    # (1280x720); foot = bottom-centre = ((x_min+x_max)/2, y_max).
    - name: "Living Room Person Position"
      unique_id: living_room_person_position
      state_topic: "frigate/events"
      value_template: "{% set a = value_json.after if value_json is mapping and 'after' in value_json else {} %}{% if a.get('camera') == 'living_room' and a.get('label') == 'person' and a.get('box') %}seen{% else %}{{ states('sensor.living_room_person_position') }}{% endif %}"
      json_attributes_topic: "frigate/events"
      json_attributes_template: "{% set a = value_json.after if value_json is mapping and 'after' in value_json else {} %}{% set b = a.get('box') %}{% if a.get('camera') == 'living_room' and a.get('label') == 'person' and b and b | length >= 4 %}{{ {'x': (((b[0] + b[2]) / 2.0) / 1280) | round(4), 'y': ((b[3] | float) / 720) | round(4), 'seen': now().timestamp() | int} | tojson }}{% else %}{{ {'x': state_attr('sensor.living_room_person_position', 'x'), 'y': state_attr('sensor.living_room_person_position', 'y'), 'seen': state_attr('sensor.living_room_person_position', 'seen')} | tojson }}{% endif %}"

template:
  # Per-light gradient brightness. Recomputes on a position move, a
  # classifier-brightness change, or a lambda/floor tweak. Position unknown
  # or != 1 person in the room -> uniform (every light at the base pct, i.e.
  # exactly today's behaviour).
  - trigger:
      - trigger: state
        entity_id:
          - sensor.living_room_person_position
          - sensor.living_room_sofa_lighting_state
          - input_number.living_lights_gradient_lambda
          - input_number.living_lights_gradient_floor
      - trigger: homeassistant
        event: start
    action:
      - variables:
          px: "{{ state_attr('sensor.living_room_person_position', 'x') | float(-1) }}"
          py: "{{ state_attr('sensor.living_room_person_position', 'y') | float(-1) }}"
          base: "{{ state_attr('sensor.living_room_sofa_lighting_state', 'predicted_brightness_pct') | int(0) }}"
          lam: "{{ states('input_number.living_lights_gradient_lambda') | float(0.6) }}"
          flr: "{{ states('input_number.living_lights_gradient_floor') | float(0.4) }}"
          people: "{{ states('sensor.living_room_person_count') | int(0) }}"
          uniform: "{{ px < 0 or py < 0 or people != 1 }}"
          raw_front_left: "{{ 1.0 if uniform else 2.718281828 ** (-1.0 * ((px - 0.359) ** 2 + (py - 0.896) ** 2) / (lam * lam)) }}"
          raw_front_right: "{{ 1.0 if uniform else 2.718281828 ** (-1.0 * ((px - 0.233) ** 2 + (py - 0.581) ** 2) / (lam * lam)) }}"
          raw_rear_left: "{{ 1.0 if uniform else 2.718281828 ** (-1.0 * ((px - 0.807) ** 2 + (py - 0.488) ** 2) / (lam * lam)) }}"
          raw_rear_right: "{{ 1.0 if uniform else 2.718281828 ** (-1.0 * ((px - 0.489) ** 2 + (py - 0.368) ** 2) / (lam * lam)) }}"
          mx: "{{ [raw_front_left, raw_front_right, raw_rear_left, raw_rear_right] | max }}"
          pct_front_left: "{{ (base * ([flr, raw_front_left / (mx if mx > 0 else 1.0)] | max)) | round(0) | int }}"
          pct_front_right: "{{ (base * ([flr, raw_front_right / (mx if mx > 0 else 1.0)] | max)) | round(0) | int }}"
          pct_rear_left: "{{ (base * ([flr, raw_rear_left / (mx if mx > 0 else 1.0)] | max)) | round(0) | int }}"
          pct_rear_right: "{{ (base * ([flr, raw_rear_right / (mx if mx > 0 else 1.0)] | max)) | round(0) | int }}"
    sensor:
      - name: "Living Room Sofa Gradient"
        unique_id: living_room_sofa_gradient
        state: "{{ 'uniform' if uniform else 'gradient' }}"
        attributes:
          front_left_pct: "{{ pct_front_left }}"
          front_right_pct: "{{ pct_front_right }}"
          rear_left_pct: "{{ pct_rear_left }}"
          rear_right_pct: "{{ pct_rear_right }}"
          base_pct: "{{ base }}"
          person_x: "{{ px }}"
          person_y: "{{ py }}"

automation:
  # Gradient actuator — layers per-light brightness over the sofa pilot.
  # Shadow-gated; a 6 s rate-limit bounds Hue-bridge command volume (AR-2).
  - alias: "Living Lights - sofa gradient actuator"
    id: living_lights_gradient_sofa
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id: sensor.living_room_sofa_gradient
      # Periodic re-evaluation so manual-cooldown expiry isn't gated on a
      # gradient sensor state change (e.g., when the user is stationary).
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: input_boolean.living_lights_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.living_lights_shadow
        state: "off"
      - condition: state
        entity_id: input_boolean.living_lights_zone_sofa_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.living_lights_gradient_enabled
        state: "on"
      - condition: state
        entity_id: sensor.living_room_sofa_lighting_state
        state:
          - present
          - pass_through
      # Manual-touch cooldown gate (R5-aligned, vacant-15-min semantics). Reads
      # input_datetime directly. State-bypass + asleep-bypass + sentinel-aware
      # — matches the pilot's cooldown gate exactly.
      - condition: template
        value_template: >-
          {% set state = states('sensor.living_room_sofa_lighting_state') %}
          {% set asleep = is_state('input_boolean.living_lights_asleep', 'on') %}
          {% if state not in ['vacant', 'present', 'pass_through'] or asleep %}true
          {% else %}
            {% set lm = states('input_datetime.living_lights_zone_sofa_last_manual_at') %}
            {% if not lm or lm in ['unknown', 'unavailable', 'none', ''] %}true
            {% else %}
              {% set manual_dt = as_datetime(lm | string) %}
              {% if manual_dt.year < 2000 %}true
              {% else %}
                {% set stable_obj = states.binary_sensor.living_room_sofa_person_occupancy_stable %}
                {% if stable_obj is none %}true
                {% elif stable_obj.state == 'on' %}false
                {% else %}
                  {% set leave_time = stable_obj.last_changed %}
                  {{ (now() - ([manual_dt, leave_time] | max)).total_seconds() > 900 }}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endif %}
      - condition: template
        value_template: >-
          {% set lt = state_attr(this.entity_id, 'last_triggered') %}
          {% if lt %}{{ (now() - lt).total_seconds() > 6 }}{% else %}true{% endif %}
    actions:
      - variables:
          grad_ct: "{{ state_attr('sensor.living_room_sofa_lighting_state', 'predicted_color_temp_kelvin') | int(2700) }}"
      - action: light.turn_on
        target:
          entity_id: light.front_left
        data:
          brightness_pct: "{{ [ state_attr('sensor.living_room_sofa_gradient', 'front_left_pct') | int(5), 5 ] | max }}"
          color_temp_kelvin: "{{ grad_ct }}"
          transition: 0.8
      - action: light.turn_on
        target:
          entity_id: light.front_right
        data:
          brightness_pct: "{{ [ state_attr('sensor.living_room_sofa_gradient', 'front_right_pct') | int(5), 5 ] | max }}"
          color_temp_kelvin: "{{ grad_ct }}"
          transition: 0.8
      - action: light.turn_on
        target:
          entity_id: light.rear_left
        data:
          brightness_pct: "{{ [ state_attr('sensor.living_room_sofa_gradient', 'rear_left_pct') | int(5), 5 ] | max }}"
          color_temp_kelvin: "{{ grad_ct }}"
          transition: 0.8
      - action: light.turn_on
        target:
          entity_id: light.rear_right
        data:
          brightness_pct: "{{ [ state_attr('sensor.living_room_sofa_gradient', 'rear_right_pct') | int(5), 5 ] | max }}"
          color_temp_kelvin: "{{ grad_ct }}"
          transition: 0.8
  # Per-light gradient-decision logger — shadow-mode visibility. Reuses the
  # shell_command from living_lights_shadow.yaml.
  - alias: "Living Lights - log sofa gradient decisions"
    id: living_lights_gradient_log_sofa
    mode: parallel
    max: 20
    triggers:
      - trigger: state
        entity_id: sensor.living_room_sofa_gradient
    conditions: []
    actions:
      - variables:
          json_payload: >-
            {{ {'ts': now().isoformat(), 'kind': 'gradient_decision', 'zone': 'sofa', 'state': states('sensor.living_room_sofa_gradient'), 'lights': {'front_left': state_attr('sensor.living_room_sofa_gradient', 'front_left_pct') | int(0), 'front_right': state_attr('sensor.living_room_sofa_gradient', 'front_right_pct') | int(0), 'rear_left': state_attr('sensor.living_room_sofa_gradient', 'rear_left_pct') | int(0), 'rear_right': state_attr('sensor.living_room_sofa_gradient', 'rear_right_pct') | int(0)}, 'shadow_mode': is_state('input_boolean.living_lights_shadow', 'on')} | tojson }}
      - action: shell_command.living_lights_append_log
        data:
          payload: "{{ json_payload | base64_encode }}"
