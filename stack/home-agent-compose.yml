name: home-agent

# Dedicated, CPU-only Home Agent deployment. This intentionally does not join
# the legacy GPU/Intelligence project and publishes neither PostgreSQL nor the
# Core roles on the host.

x-core-environment: &core-environment
  HOME_AGENT_PORT: "8104"
  HOME_AGENT_RUNTIME_SPOOL_PATH: /runtime/runtime.sqlite
  HOME_AGENT_RUNTIME_TTL_SECONDS: "86400"
  HOME_AGENT_RUNTIME_MAX_BYTES: "104857600"
  HOME_AGENT_STORAGE_MONITOR_PATH: /storage-monitor/durable
  HOME_AGENT_DATABASE_URL_FILE: /run/secrets/database_url
  HOME_AGENT_POLICY_VERSION: home-agent-mvp-v1
  HOME_AGENT_POLICY_DIGEST: "${HOME_AGENT_POLICY_DIGEST:?hash stack/home-agent-deploy/policy/home-agent-mvp-v1.json}"
  # Read-only deployment policy. Advancing this value requires an operator
  # review and container replacement; no API can promote its own rollout mode.
  HOME_AGENT_ROLLOUT_MODE: "${HOME_AGENT_ROLLOUT_MODE:-record_only}"

x-core-service: &core-service
  build:
    context: ./services/home-agent-core
  image: engineered-lighting/home-agent-core:local
  restart: unless-stopped
  read_only: true
  user: "10001:10001"
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  tmpfs:
    - /tmp:size=16m,mode=1777
  mem_limit: 512m
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8104/readyz', timeout=3).read()"]
    interval: 15s
    timeout: 5s
    retries: 8
    start_period: 20s

services:
  postgres:
    build:
      context: ./home-agent-deploy
      dockerfile: postgres.Dockerfile
      args:
        POSTGRES_BASE_IMAGE: "${HOME_AGENT_POSTGRES_IMAGE:-postgres:17.10-bookworm@sha256:17b6c778de50f4bb9a878c36e736110fbcd9b7020377d6fdfdf20f7c0347e40a}"
    image: engineered-lighting/home-agent-postgres:17.10
    platform: linux/amd64
    # pgBackRest archive-async forks detached transfer processes. PostgreSQL
    # must not be PID 1 or it can reap an orphaned pgBackRest failure as if a
    # database backend exited, forcing crash recovery while the repository is
    # unavailable. Docker's tiny init owns PID 1 and reaps those descendants.
    init: true
    restart: unless-stopped
    shm_size: 256m
    environment:
      POSTGRES_DB: home_agent
      POSTGRES_USER: home_agent_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
      # Every socket and network client authenticates. In particular, the
      # backup container may never impersonate the bootstrap superuser.
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command:
      - postgres
      - -c
      - fsync=on
      - -c
      - synchronous_commit=on
      - -c
      - full_page_writes=on
      - -c
      - password_encryption=scram-sha-256
      - -c
      - hba_file=/etc/pg_hba-home-agent.conf
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=40
      - -c
      - log_statement=none
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      - archive_command=flock -s /run/home-agent-locks/repository.lock pgbackrest --stanza=home-agent archive-push %p
    secrets:
      - source: postgres_owner_password_postgres
        target: postgres_owner_password
    volumes:
      - type: bind
        source: "${HOME_AGENT_DATA_ROOT:?set to the dedicated encrypted volume}/postgres"
        target: /var/lib/postgresql/data
      - "${HOME_AGENT_PGBACKREST_CONF:?configure encrypted pgBackRest repository}:/etc/pgbackrest/pgbackrest.conf:ro"
      # Local repo1 is the standalone recovery anchor. Legacy remote material
      # is never mounted into the active database service.
      - "${HOME_AGENT_PGBACKREST_LOCAL_REPO_ROOT:?set local pgBackRest repository root}:/repository"
      - "${HOME_AGENT_PGBACKREST_SPOOL_ROOT:?set fresh topology-specific pgBackRest spool}:/var/spool/pgbackrest"
      - "${HOME_AGENT_PGBACKREST_LOCK_FILE:?set repository coordination lock}:/run/home-agent-locks/repository.lock"
      - postgres-socket:/var/run/postgresql
      - ./home-agent-deploy/postgres-pg_hba.conf:/etc/pg_hba-home-agent.conf:ro
    networks: [postgres-net]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_agent_owner -d home_agent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  backup-gate:
    build:
      context: ./home-agent-deploy
      dockerfile: postgres.Dockerfile
      args:
        POSTGRES_BASE_IMAGE: "${HOME_AGENT_POSTGRES_IMAGE:-postgres:17.10-bookworm@sha256:17b6c778de50f4bb9a878c36e736110fbcd9b7020377d6fdfdf20f7c0347e40a}"
    image: engineered-lighting/home-agent-postgres:17.10
    restart: "no"
    user: "999:999"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    entrypoint: ["/bin/sh", "/deploy/backup-gate.sh"]
    environment:
      POSTGRES_BACKUP_PASSWORD_FILE: /run/secrets/postgres_backup_password
      HOME_AGENT_BACKUP_MIN_FREE_KIB: "${HOME_AGENT_BACKUP_MIN_FREE_KIB:-2097152}"
      HOME_AGENT_BACKUP_TYPE: full
    secrets:
      - source: postgres_backup_password_backup_gate
        target: postgres_backup_password
    volumes:
      - type: bind
        source: "${HOME_AGENT_DATA_ROOT:?set to the dedicated encrypted volume}/postgres"
        target: /var/lib/postgresql/data
        read_only: true
      - "${HOME_AGENT_PGBACKREST_CONF:?configure encrypted pgBackRest repository}:/etc/pgbackrest/pgbackrest.conf:ro"
      - "${HOME_AGENT_PGBACKREST_LOCAL_REPO_ROOT:?set local pgBackRest repository root}:/repository"
      - "${HOME_AGENT_PGBACKREST_SPOOL_ROOT:?set fresh topology-specific pgBackRest spool}:/var/spool/pgbackrest"
      - "${HOME_AGENT_PGBACKREST_LOCK_FILE:?set repository coordination lock}:/run/home-agent-locks/repository.lock"
      - "${HOME_AGENT_PGBACKREST_BACKUP_LOCK_FILE:?set backup serialization lock}:/run/home-agent-locks/backup.lock"
      - postgres-socket:/var/run/postgresql:ro
      - ./home-agent-deploy:/deploy:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    # The bootstrap backup is intentionally bounded on the 14900K host. The
    # database is small and correctness is more important than compression
    # throughput during the startup gate.
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 128
    network_mode: none
    depends_on:
      provision-roles: {condition: service_completed_successfully}

  provision-roles:
    image: "${HOME_AGENT_POSTGRES_IMAGE:-postgres:17.10-bookworm@sha256:17b6c778de50f4bb9a878c36e736110fbcd9b7020377d6fdfdf20f7c0347e40a}"
    platform: linux/amd64
    restart: "no"
    entrypoint: ["/bin/sh", "/deploy/provision-roles.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: home_agent
      PGUSER: home_agent_owner
      POSTGRES_OWNER_PASSWORD_FILE: /run/secrets/postgres_owner_password
    secrets:
      - source: postgres_owner_password_provision
        target: postgres_owner_password
      - source: postgres_api_password_provision
        target: postgres_api_password
      - source: postgres_binding_operator_password_provision
        target: postgres_binding_operator_password
      - source: postgres_binding_committer_password_provision
        target: postgres_binding_committer_password
      - source: postgres_identity_migration_password_provision
        target: postgres_identity_migration_password
      - source: postgres_identity_finalizer_password_provision
        target: postgres_identity_finalizer_password
      - source: postgres_ingest_password_provision
        target: postgres_ingest_password
      - source: postgres_worker_password_provision
        target: postgres_worker_password
      - source: postgres_erasure_password_provision
        target: postgres_erasure_password
      - source: postgres_rollout_password_provision
        target: postgres_rollout_password
      - source: postgres_backup_password_provision
        target: postgres_backup_password
    volumes:
      - ./home-agent-deploy:/deploy:ro
    networks: [postgres-net]
    depends_on:
      postgres: {condition: service_healthy}

  provision-identity-cutover-roles:
    image: "${HOME_AGENT_POSTGRES_IMAGE:-postgres:17.10-bookworm@sha256:17b6c778de50f4bb9a878c36e736110fbcd9b7020377d6fdfdf20f7c0347e40a}"
    platform: linux/amd64
    profiles: [operator]
    restart: "no"
    entrypoint:
      ["/bin/sh", "/deploy/provision-identity-cutover-roles.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: home_agent
      PGUSER: home_agent_owner
      POSTGRES_OWNER_PASSWORD_FILE: /run/secrets/postgres_owner_password
    secrets:
      - source: postgres_owner_password_identity_cutover_provision
        target: postgres_owner_password
      - source: postgres_identity_cutover_password_identity_cutover_provision
        target: postgres_identity_cutover_password
    volumes:
      - ./home-agent-deploy:/deploy:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [postgres-net]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: none

  migrate:
    <<: *core-service
    restart: "no"
    command: ["migrate"]
    environment:
      HOME_AGENT_DATABASE_URL_FILE: /run/secrets/database_url
      HOME_AGENT_EXPECTED_DB_REVISION: "${HOME_AGENT_EXPECTED_DB_REVISION:?set deployable database revision}"
    secrets:
      - source: database_url_owner_migrate
        target: database_url
    networks: [postgres-net]
    depends_on:
      backup-gate: {condition: service_completed_successfully}
    healthcheck: {disable: true}

  grant-runtime:
    image: "${HOME_AGENT_POSTGRES_IMAGE:-postgres:17.10-bookworm@sha256:17b6c778de50f4bb9a878c36e736110fbcd9b7020377d6fdfdf20f7c0347e40a}"
    platform: linux/amd64
    restart: "no"
    entrypoint: ["/bin/sh", "/deploy/apply-grants.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: home_agent
      PGUSER: home_agent_owner
      POSTGRES_OWNER_PASSWORD_FILE: /run/secrets/postgres_owner_password
    secrets:
      - source: postgres_owner_password_grant
        target: postgres_owner_password
    volumes:
      - ./home-agent-deploy:/deploy:ro
    networks: [postgres-net]
    depends_on:
      migrate: {condition: service_completed_successfully}

  grant-phase3-activation:
    image: "${HOME_AGENT_POSTGRES_IMAGE:-postgres:17.10-bookworm@sha256:17b6c778de50f4bb9a878c36e736110fbcd9b7020377d6fdfdf20f7c0347e40a}"
    platform: linux/amd64
    profiles: [operator]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - >-
        install -d -m 0700 /run/phase3-activation;
        install -m 0600 /run/secrets/phase3_grant_permit
        /run/phase3-activation/permit;
        exec /bin/sh /deploy/apply-grants.sh
    environment:
      PGHOST: postgres
      PGDATABASE: home_agent
      PGUSER: home_agent_owner
      POSTGRES_OWNER_PASSWORD_FILE: /run/secrets/postgres_owner_password
      HOME_AGENT_PHASE3_GRANT_PERMIT_FILE: /run/phase3-activation/permit
    secrets:
      - source: postgres_owner_password_phase3_activation
        target: postgres_owner_password
      - source: phase3_grant_permit_phase3_activation
        target: phase3_grant_permit
    volumes:
      - ./home-agent-deploy:/deploy:ro
    tmpfs:
      - /run/phase3-activation:size=64k,mode=0700
    networks: [postgres-net]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: none

  core-api:
    <<: *core-service
    command: ["api"]
    environment:
      <<: *core-environment
      HOME_AGENT_ROLE: api
      HOME_AGENT_KNOWLEDGE_ENCRYPTION_KEY_FILE: /run/secrets/knowledge_encryption_key
      HOME_AGENT_OPERATOR_DATABASE_URL_FILE: /run/secrets/operator_database_url
      HOME_AGENT_BINDING_COMMIT_DATABASE_URL_FILE: /run/secrets/binding_commit_database_url
      HOME_AGENT_SERVICE_TOKEN_FILE: /run/secrets/service_token
      HOME_AGENT_OPERATOR_TOKEN_FILE: /run/secrets/operator_token
      HOME_AGENT_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
    secrets:
      - source: database_url_api_core_api
        target: database_url
      - source: database_url_binding_operator_core_api
        target: operator_database_url
      - source: database_url_binding_committer_core_api
        target: binding_commit_database_url
      - source: knowledge_encryption_key_core_api
        target: knowledge_encryption_key
      - source: service_token_core_api
        target: service_token
      - source: operator_token_core_api
        target: operator_token
      - source: bootstrap_token_core_api
        target: bootstrap_token
    volumes:
      - type: bind
        source: "${HOME_AGENT_DATA_ROOT}/resource-monitor"
        target: /storage-monitor/durable
        read_only: true
      - type: bind
        source: "${HOME_AGENT_ERASURE_LEDGER_ROOT:?set independent encrypted ledger directory}"
        target: /erasure-ledger
        read_only: true
      - type: bind
        source: /dev/null
        target: /erasure-ledger/ledger.jsonl
        read_only: true
    networks: [postgres-net, api-net]
    depends_on:
      grant-runtime: {condition: service_completed_successfully}

  core-ingest:
    <<: *core-service
    command: ["ingest"]
    environment:
      <<: *core-environment
      HOME_AGENT_ROLE: ingest
      HOME_AGENT_KNOWLEDGE_ENCRYPTION_KEY_FILE: /run/secrets/knowledge_encryption_key
      HOME_AGENT_RUNTIME_SPOOL_KEY_FILE: /run/secrets/runtime_spool_key
      HOME_AGENT_EDGE_TOKEN_FILE: /run/secrets/edge_token
    secrets:
      - source: database_url_ingest_core_ingest
        target: database_url
      - source: runtime_spool_key_core_ingest
        target: runtime_spool_key
      - source: knowledge_encryption_key_core_ingest
        target: knowledge_encryption_key
      - source: edge_token_core_ingest
        target: edge_token
    volumes:
      - type: bind
        source: "${HOME_AGENT_RUNTIME_ROOT:?set encrypted backup-excluded runtime directory}"
        target: /runtime
      - type: bind
        source: "${HOME_AGENT_DATA_ROOT}/resource-monitor"
        target: /storage-monitor/durable
        read_only: true
      - type: bind
        source: "${HOME_AGENT_ERASURE_LEDGER_ROOT}"
        target: /erasure-ledger
        read_only: true
      - type: bind
        source: /dev/null
        target: /erasure-ledger/ledger.jsonl
        read_only: true
    networks: [postgres-net, ingest-net]
    depends_on:
      grant-runtime: {condition: service_completed_successfully}

  core-worker:
    <<: *core-service
    command: ["worker"]
    environment:
      <<: *core-environment
      HOME_AGENT_ROLE: worker
      HOME_AGENT_RUNTIME_SPOOL_KEY_FILE: /run/secrets/runtime_spool_key
      HOME_AGENT_ERASURE_LEDGER_PATH: /erasure-ledger/ledger.jsonl
      HOME_AGENT_ERASURE_LEDGER_HEAD_PATH: /erasure-ledger/ledger.head.json
      HOME_AGENT_ERASURE_LEDGER_KEY_FILE: /run/secrets/erasure_ledger_key
    secrets:
      - source: database_url_worker_core_worker
        target: database_url
      - source: runtime_spool_key_core_worker
        target: runtime_spool_key
      - source: erasure_ledger_key_core_worker
        target: erasure_ledger_key
    volumes:
      - type: bind
        source: "${HOME_AGENT_RUNTIME_ROOT}"
        target: /runtime
      - type: bind
        source: "${HOME_AGENT_DATA_ROOT}/resource-monitor"
        target: /storage-monitor/durable
        read_only: true
      - type: bind
        source: "${HOME_AGENT_ERASURE_LEDGER_ROOT}"
        target: /erasure-ledger
    networks: [postgres-net]
    depends_on:
      grant-runtime: {condition: service_completed_successfully}

  ledger-init:
    <<: *core-service
    profiles: [operator]
    restart: "no"
    command: ["ledger-init"]
    environment:
      HOME_AGENT_ERASURE_LEDGER_PATH: /erasure-ledger/ledger.jsonl
      HOME_AGENT_ERASURE_LEDGER_HEAD_PATH: /erasure-ledger/ledger.head.json
      HOME_AGENT_ERASURE_LEDGER_KEY_FILE: /run/secrets/erasure_ledger_key
    secrets:
      - source: erasure_ledger_key_ledger_init
        target: erasure_ledger_key
    volumes:
      - type: bind
        source: "${HOME_AGENT_ERASURE_LEDGER_ROOT:?set independent encrypted ledger directory}"
        target: /erasure-ledger
    network_mode: none
    healthcheck: {disable: true}

  restore-replay:
    <<: *core-service
    profiles: [operator]
    restart: "no"
    command: ["restore-replay"]
    environment:
      <<: *core-environment
      HOME_AGENT_ROLE: restore
      HOME_AGENT_DATABASE_URL_FILE: /run/secrets/database_url
      HOME_AGENT_ERASURE_LEDGER_PATH: /erasure-ledger/ledger.jsonl
      HOME_AGENT_ERASURE_LEDGER_HEAD_PATH: /erasure-ledger/ledger.head.json
      HOME_AGENT_ERASURE_LEDGER_KEY_FILE: /run/secrets/erasure_ledger_key
    secrets:
      - source: database_url_erasure_restore_replay
        target: database_url
      - source: erasure_ledger_key_restore_replay
        target: erasure_ledger_key
    volumes:
      - type: bind
        source: "${HOME_AGENT_ERASURE_LEDGER_ROOT}"
        target: /erasure-ledger
    networks: [postgres-net]
    depends_on:
      grant-runtime: {condition: service_completed_successfully}
    healthcheck: {disable: true}

  rollout-authorize:
    <<: *core-service
    profiles: [operator]
    restart: "no"
    command: ["authorize-shadow"]
    stdin_open: true
    environment:
      <<: *core-environment
      HOME_AGENT_ROLE: rollout
    secrets:
      - source: database_url_rollout_rollout_authorize
        target: database_url
    volumes:
      - type: bind
        source: "${HOME_AGENT_DATA_ROOT}/resource-monitor"
        target: /storage-monitor/durable
        read_only: true
      - type: bind
        source: "${HOME_AGENT_ERASURE_LEDGER_ROOT}"
        target: /erasure-ledger
        read_only: true
      - type: bind
        source: /dev/null
        target: /erasure-ledger/ledger.jsonl
        read_only: true
    networks: [postgres-net]
    depends_on:
      grant-runtime: {condition: service_completed_successfully}
    healthcheck: {disable: true}
    logging:
      driver: none

  edge-ingress:
    image: "${HOME_AGENT_NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.29-alpine}"
    restart: unless-stopped
    user: "101:101"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ports:
      - "${HOME_AGENT_EDGE_BIND_ADDR:?set an HA-reachable allowlisted address}:8443:8443"
    volumes:
      - ./home-agent-deploy/nginx-edge.conf:/etc/nginx/nginx.conf:ro
    secrets:
      - source: tls_server_crt
        target: server.crt
      - source: tls_server_key
        target: server.key
      - source: tls_client_ca
        target: client-ca.crt
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0700,uid=101,gid=101
    networks: [ingest-net, edge-public]
    depends_on:
      core-ingest: {condition: service_healthy}
    mem_limit: 64m

  bff:
    build:
      context: ./services/home-agent-bff
    image: engineered-lighting/home-agent-bff:local
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      HOME_AGENT_BFF_HOST: 0.0.0.0
      HOME_AGENT_BFF_PORT: "8097"
      HOME_AGENT_ALLOWED_ORIGINS: "${HOME_AGENT_ALLOWED_ORIGINS:?set exact HTTPS origins}"
      HOME_AGENT_HA_URL: "${HOME_AGENT_HA_URL:?set Home Assistant base URL}"
      HOME_AGENT_OAUTH_CLIENT_ID: "${HOME_AGENT_OAUTH_CLIENT_ID:?set registered HA client ID}"
      HOME_AGENT_OAUTH_REDIRECT_URI: "${HOME_AGENT_OAUTH_REDIRECT_URI:?set /api/agent/auth/callback URL}"
      HOME_AGENT_NATIVE_PUBLIC_ORIGIN: "${HOME_AGENT_NATIVE_PUBLIC_ORIGIN:?set exact dedicated native HTTPS origin}"
      HOME_AGENT_POST_LOGIN_REDIRECT: /home-agent/index.html
      HOME_AGENT_CORE_URL: http://core-api:8104
      HOME_AGENT_CORE_TOKEN_FILE: /run/secrets/service_token
      HOME_AGENT_SESSION_ENCRYPTION_KEY_FILE: /run/secrets/session_encryption_key
      HOME_AGENT_NATIVE_INSTALLATIONS_FILE: /run/secrets/native_installations
      HOME_AGENT_SESSION_DB_PATH: /sessions/sessions.sqlite
      HOME_AGENT_PRINCIPAL_REVALIDATE_MS: "0"
    secrets:
      - source: service_token_bff
        target: service_token
      - source: session_encryption_key_bff
        target: session_encryption_key
      - source: native_installations_bff
        target: native_installations
    volumes:
      - type: bind
        source: "${HOME_AGENT_SESSION_ROOT:?set to encrypted, backup-excluded BFF session directory}"
        target: /sessions
    ports:
      - "${HOME_AGENT_BFF_BIND_ADDR:-127.0.0.1}:${HOME_AGENT_BFF_PORT:-8097}:8097"
    networks:
      api-net: {}
      bff-public:
        # This fixed source address is the only container address admitted to
        # the host's local Tailscale HA OAuth listener. Keep it outside the
        # internal API network so OAuth egress cannot widen Core reachability.
        ipv4_address: "${HOME_AGENT_BFF_EGRESS_IP:-172.22.0.10}"
    depends_on:
      core-api: {condition: service_healthy}
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8097/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5

  identity-migration:
    image: engineered-lighting/home-agent-core:local
    profiles: [operator]
    # The sequential HTTP apply path is retired. Keep the separately
    # provisioned role/secret surface expired for the manifest kernel, but
    # never mount its URL or the legacy database into this obsolete service.
    restart: "no"
    user: "10001:10001"
    read_only: true
    init: true
    stdin_open: true
    tty: true
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 'sequential identity migration is retired; use the reviewed atomic finalizer' >&2; exit 78"]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=16m,mode=1777
    network_mode: none
    mem_limit: 256m
    logging:
      driver: none

  identity-finalizer:
    image: engineered-lighting/home-agent-core:local
    profiles: [operator]
    # The executor is callable only while the independently provisioned login
    # has a root-controlled, bounded activation. The default 1970 expiry keeps
    # this surface inert even though the private stdin protocol is installed.
    restart: "no"
    user: "10001:10001"
    read_only: true
    init: true
    stdin_open: true
    tty: false
    command: [identity-finalize]
    environment:
      HOME_AGENT_DATABASE_URL_FILE: /run/secrets/database_url
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    secrets:
      - source: database_url_identity_finalizer_identity_finalizer
        target: database_url
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [postgres-net]
    depends_on:
      grant-runtime: {condition: service_completed_successfully}
    mem_limit: 128m
    logging:
      driver: none

  identity-cutover:
    image: engineered-lighting/home-agent-core:local
    profiles: [operator]
    # The executor accepts one private stdin document. The role remains expired
    # until a later root-controlled ceremony has verified writer freeze and
    # every E4 admission receipt.
    restart: "no"
    user: "10001:10001"
    read_only: true
    init: true
    stdin_open: true
    tty: false
    command: [identity-cutover]
    environment:
      HOME_AGENT_DATABASE_URL_FILE: /run/secrets/database_url
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    secrets:
      - source: database_url_identity_cutover_identity_cutover
        target: database_url
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [postgres-net]
    depends_on:
      grant-runtime: {condition: service_completed_successfully}
    mem_limit: 128m
    logging:
      driver: none

