# living_lights_manual_detection.yaml — GENERATED by tools/build-living-lights-actuators.py
#
# Fast manual hold arming + settled manual-touch detection +
# cooldown-expire + voice-override-reset.
#
# Fast arming stamps last_manual_at immediately for external light changes
# whose actual state does not match the current Living Lights prediction.
# This is what makes Lutron/HomeKit/Siri/physical touches stick before an
# actuator can revert them, even when HA context metadata is parented.
#
# Settled detection still fires `living_lights_override_detected` HA bus event
# after 3s whenever a light's brightness diverges from any owning zone's
# prediction (with ramp-window and sofa-gradient absorption). Event fires
# ALWAYS when input_boolean.living_lights_enabled is on. JSONL preference
# capture is additionally gated by input_boolean.living_lights_learning_enabled.
#
# Vacancy-expire writes the 1970-01-01 sentinel to last_manual_at after the
# zone has been vacant for 15 continuous minutes — the cooldown then treats
# the manual as fully expired even across cross-day re-entries.
#
# Voice-override-reset writes the sentinel when input_text.living_lights_
# override_text_<slug> is set (e.g., by the agent's set_presence_override
# tool) so voice commands supersede prior manual cooldown.
#
# DO NOT EDIT BY HAND. Edit tools/build-living-lights-actuators.py and re-run.

shell_command:
  living_lights_append_preference_log: 'sh -c "echo {{ payload }} | base64 -d >> /config/lighting_preferences_pending.jsonl; echo >> /config/lighting_preferences_pending.jsonl"'
  living_lights_append_activity_log: 'sh -c "echo {{ payload }} | base64 -d >> /config/lighting_activity.jsonl; echo >> /config/lighting_activity.jsonl"'

input_text:
  living_lights_zone_dining_left_last_command_id:
    name: "Living Lights dining left last command id"
    max: 80
  living_lights_zone_dining_right_last_command_id:
    name: "Living Lights dining right last command id"
    max: 80
  living_lights_zone_front_door_last_command_id:
    name: "Living Lights front door last command id"
    max: 80
  living_lights_zone_front_left_last_command_id:
    name: "Living Lights front left last command id"
    max: 80
  living_lights_zone_island_left_last_command_id:
    name: "Living Lights island left last command id"
    max: 80
  living_lights_zone_island_right_last_command_id:
    name: "Living Lights island right last command id"
    max: 80
  living_lights_zone_office_last_command_id:
    name: "Living Lights office last command id"
    max: 80
  living_lights_zone_sink_last_command_id:
    name: "Living Lights sink last command id"
    max: 80
  living_lights_zone_sofa_last_command_id:
    name: "Living Lights sofa last command id"
    max: 80
  living_lights_zone_weights_last_command_id:
    name: "Living Lights weights last command id"
    max: 80

automation:
  - alias: "Living Lights - fast manual hold arm (light.kitchen)"
    id: living_lights_fast_manual_arm_kitchen
    mode: queued
    max: 20
    triggers:
      - trigger: state
        entity_id: light.kitchen
      - trigger: state
        entity_id: light.kitchen
        attribute: brightness
      - trigger: state
        entity_id: light.kitchen
        attribute: color_temp_kelvin
      - trigger: state
        entity_id: light.kitchen
        attribute: color_temp
    conditions:
      - condition: state
        entity_id: input_boolean.living_lights_enabled
        state: "on"
    actions:
      - variables:
          ctx_id: "hold-{{ now().timestamp() | int }}-{{ now().microsecond }}"
          match_ok: >-
            {% set ns = namespace(ok=false) %}
            {% set ap = ((state_attr('light.kitchen', 'brightness') | float(0)) / 2.55) | round(0) | int if is_state('light.kitchen', 'on') else 0 %}
            {% if not ns.ok %}
              {% set p = state_attr('sensor.kitchen_sink_lighting_state', 'predicted_brightness_pct') | float(-1) %}
              {% set ri = state_attr('sensor.kitchen_sink_lighting_state', 'ramp_initial_pct') | float(-1) %}
              {% set st = states('sensor.kitchen_sink_lighting_state') %}
              {% if p < 0 %}{% set ns.ok = true %}
              {% elif (ap - p) | abs <= 10 %}{% set ns.ok = true %}
              {% elif st == 'present' and ri >= 0 and ap >= ([ri, p] | min - 5) and ap <= ([ri, p] | max + 5) %}{% set ns.ok = true %}
              {% endif %}
            {% endif %}
            {% if not ns.ok %}
              {% set p = state_attr('sensor.kitchen_island_left_lighting_state', 'predicted_brightness_pct') | float(-1) %}
              {% set ri = state_attr('sensor.kitchen_island_left_lighting_state', 'ramp_initial_pct') | float(-1) %}
              {% set st = states('sensor.kitchen_island_left_lighting_state') %}
              {% if p < 0 %}{% set ns.ok = true %}
              {% elif (ap - p) | abs <= 10 %}{% set ns.ok = true %}
              {% elif st == 'present' and ri >= 0 and ap >= ([ri, p] | min - 5) and ap <= ([ri, p] | max + 5) %}{% set ns.ok = true %}
              {% endif %}
            {% endif %}
            {% if not ns.ok %}
              {% set p = state_attr('sensor.kitchen_island_right_lighting_state', 'predicted_brightness_pct') | float(-1) %}
              {% set ri = state_attr('sensor.kitchen_island_right_lighting_state', 'ramp_initial_pct') | float(-1) %}
              {% set st = states('sensor.kitchen_island_right_lighting_state') %}
              {% if p < 0 %}{% set ns.ok = true %}
              {% elif (ap - p) | abs <= 10 %}{% set ns.ok = true %}
              {% elif st == 'present' and ri >= 0 and ap >= ([ri, p] | min - 5) and ap <= ([ri, p] | max + 5) %}{% set ns.ok = true %}
              {% endif %}
            {% endif %}
            {{ ns.ok }}
      - if:
          - condition: template
            value_template: "{{ match_ok != true and match_ok != 'true' }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id:
              - input_datetime.living_lights_zone_sink_last_manual_at
              - input_datetime.living_lights_zone_island_left_last_manual_at
              - input_datetime.living_lights_zone_island_right_last_manual_at
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - action: input_text.set_value
            target:
              entity_id:
              - input_text.living_lights_zone_sink_last_override_context_id
              - input_text.living_lights_zone_island_left_last_override_context_id
              - input_text.living_lights_zone_island_right_last_override_context_id
            data:
              value: "{{ ctx_id }}"
          - event: living_lights_manual_hold_armed
            event_data:
              context_id: "{{ ctx_id }}"
              ts: "{{ now().isoformat() }}"
              zone: "sink"
              light_entity: "light.kitchen"
              camera: "kitchen"
              owning_zones: ["sink", "island_left", "island_right"]
              trigger_attribute: "{{ trigger.attribute | default(none, true) }}"
              source_user_id: "{{ trigger.to_state.context.user_id | default(none, true) }}"
              source_parent_id: "{{ trigger.to_state.context.parent_id | default(none, true) }}"
              debug_match_ok: "{{ match_ok }}"

