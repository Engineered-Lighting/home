          {% set ct_thr = states('input_number.living_lights_learning_ct_threshold_kelvin') | float(500) %}
          {% if light is none or light.state != 'on' %}
            false
          {% else %}
            {% set actual_bri = (light.attributes.brightness | int(0)) / 2.55 %}
            {% set actual_ct = light.attributes.color_temp_kelvin | int(2700) %}
            {% set predicted_bri = state_attr('sensor.living_room_sofa_lighting_state', 'predicted_brightness_pct') | int(0) %}
            {% set predicted_ct = state_attr('sensor.living_room_sofa_lighting_state', 'predicted_color_temp_kelvin') | int(2700) %}
            {% if predicted_bri == 0 %}
              false
            {% else %}
              {{ (actual_bri - predicted_bri) | abs > bri_thr_pct or (actual_ct - predicted_ct) | abs > ct_thr }}
            {% endif %}
          {% endif %}
        attributes:
          zone: sofa
          light_entity: "light.front_left"
          actual_brightness_pct: >
            {% set light = states.light.front_left %}
            {% if light and light.state == 'on' %}
              {{ ((light.attributes.brightness | int(0)) / 2.55) | round(0) }}
            {% else %}0{% endif %}
          actual_color_temp_kelvin: >
            {% set light = states.light.front_left %}
            {% if light and light.state == 'on' %}
              {{ light.attributes.color_temp_kelvin | int(2700) }}
            {% else %}0{% endif %}
          predicted_brightness_pct: >
            {{ state_attr('sensor.living_room_sofa_lighting_state', 'predicted_brightness_pct') | int(0) }}
          predicted_color_temp_kelvin: >
            {{ state_attr('sensor.living_room_sofa_lighting_state', 'predicted_color_temp_kelvin') | int(2700) }}

