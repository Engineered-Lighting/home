# NOT merged into stack/docker-compose.yml — the video-labeler runs STANDALONE
# (deploy via tools/deploy-video-labeler.ps1). It needs --network host (to reach
# native Ollama on 127.0.0.1:11434 in later milestones) and --gpus all, which
# the compose stack's bridged homeai network does not provide.
#
# Reference run command (what the deploy script executes on hav-ubuntu):
#
#   docker run -d --name hav-video-labeler \
#     --network host \
#     --gpus all \
#     --restart unless-stopped \
#     --read-only --cap-drop ALL --security-opt no-new-privileges:true \
#     --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m \
#     -v /opt/home-ai-voice/video-labeler-data:/data \
#     -v /etc/home-ai-voice/secrets/video_labeler_token:/run/secrets/video_labeler_token:ro \
#     --env-file /etc/home-ai-voice/video-labeler.env \
#     -e PORT=8099 -e BIND_HOST=127.0.0.1 -e DATA_DIR=/data \
#     -e VIDEO_LABELER_API_TOKEN_FILE=/run/secrets/video_labeler_token \
#     video-labeler
#
# The isolated research container deliberately has no Docker socket. M2+
# host-level GPU eviction remains disabled until it has a separate narrow
# supervisor rather than root-equivalent access to the Docker daemon.
#
# Equivalent compose shape, FOR REFERENCE ONLY if it is ever folded in:
services:
  video-labeler:
    build: ./services/video-labeler
    container_name: hav-video-labeler
    restart: unless-stopped
    network_mode: host        # binds PORT (default 8099) directly on the host
    volumes:
      - /opt/home-ai-voice/video-labeler-data:/data
      - /etc/home-ai-voice/secrets/video_labeler_token:/run/secrets/video_labeler_token:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    environment:
      - DATA_DIR=/data
      - PORT=8099
      - BIND_HOST=127.0.0.1
      - VIDEO_LABELER_API_TOKEN_FILE=/run/secrets/video_labeler_token
      - MIN_FREE_VRAM_GB=6
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8099/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
