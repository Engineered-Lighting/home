template:

  - trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/1"
    sensor:
      - name: "Living Lights Profile"
        unique_id: living_lights_profile
        icon: mdi:weather-sunset
        state: >
          {% set h = now().hour + now().minute/60 %}
          {% if h < 6 %}overnight
          {% elif h < 9 %}morning
          {% elif h < 13 %}midday
          {% elif h < 17 %}afternoon
          {% elif h < 20 %}evening
          {% elif h < 22.5 %}late_evening
          {% else %}overnight
          {% endif %}
        attributes:
          tod_factor: >
            {% set h = now().hour + now().minute/60 %}
            {% if h < 6 %}0.10
            {% elif h < 9 %}{{ (0.30 + (h-6)/3 * 0.50) | round(2) }}
            {% elif h < 13 %}{{ (0.80 + (h-9)/4 * 0.15) | round(2) }}
            {% elif h < 17 %}0.95
            {% elif h < 20 %}{{ (0.85 - (h-17)/3 * 0.35) | round(2) }}
            {% elif h < 22.5 %}{{ (0.50 - (h-20)/2.5 * 0.30) | round(2) }}
            {% else %}0.10
            {% endif %}
          tod_color_warm: >
            {% set h = now().hour + now().minute/60 %}
            {% if h < 6 %}2000
            {% elif h < 9 %}2200
            {% elif h < 13 %}2700
            {% elif h < 17 %}3000
            {% elif h < 20 %}2500
            {% elif h < 22.5 %}2200
            {% else %}2000
            {% endif %}
          tod_color_cool: >
            {% set h = now().hour + now().minute/60 %}
            {% if h < 6 %}2200
            {% elif h < 9 %}2700
            {% elif h < 13 %}4000
            {% elif h < 17 %}4500
            {% elif h < 20 %}3000
            {% elif h < 22.5 %}2500
            {% else %}2200
            {% endif %}
          max_brightness_pct: >
            {% set h = now().hour + now().minute/60 %}
            {% if (h < 6) or (h >= 22.5) %}8
            {% elif h >= 20 %}50
            {% else %}100
            {% endif %}
          transition_s: >
            {% set h = now().hour + now().minute/60 %}
            {% if (h < 6) or (h >= 22.5) %}4.0
            {% elif h >= 20 %}2.5
            {% else %}1.5
            {% endif %}

  - trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - input_boolean.homeai_sleep
    binary_sensor:
      - name: "Living Lights is night-safe"
        unique_id: living_lights_is_night_safe
        icon: mdi:weather-night
        state: >
          {{ is_state('input_boolean.homeai_sleep', 'on') }}

  - trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - binary_sensor.dining_left_person_occupancy
          - binary_sensor.dining_right_person_occupancy
          - binary_sensor.sink_person_occupancy
          - binary_sensor.island_left_person_occupancy
          - binary_sensor.island_right_person_occupancy
          - binary_sensor.sofa_person_occupancy
          - binary_sensor.front_left_person_occupancy
          - binary_sensor.weights_person_occupancy
          - binary_sensor.office_person_occupancy
          - binary_sensor.front_door_person_occupancy
          - binary_sensor.whole_living_room_person_occupancy
          - binary_sensor.workshop_zone_person_occupancy
          - binary_sensor.e28_person_occupancy
          - binary_sensor.whole_dining_room_person_occupancy
          - binary_sensor.whole_kitchen_person_occupancy
      - platform: time_pattern
        seconds: "/15"
    sensor:
      - name: "Dining Room Dining Left Dwell"
        unique_id: dining_room_dining_left_dwell_ms
        icon: mdi:timer-sand
        unit_of_measurement: "ms"
        state: >
          {% set stable = states.binary_sensor.dining_room_dining_left_person_occupancy_stable %}
          {% set raw = states.binary_sensor.dining_left_person_occupancy %}
          {% if stable is not none and stable.state == 'on' %}
            {% if raw is not none and raw.state == 'off' %}
              {{ ((raw.last_changed - stable.last_changed).total_seconds() * 1000) | round(0) }}
            {% else %}
              {{ ((now() - stable.last_changed).total_seconds() * 1000) | round(0) }}
            {% endif %}
          {% else %}0{% endif %}

      - name: "Dining Room Dining Right Dwell"
        unique_id: dining_room_dining_right_dwell_ms
        icon: mdi:timer-sand
        unit_of_measurement: "ms"
        state: >
          {% set stable = states.binary_sensor.dining_room_dining_right_person_occupancy_stable %}
          {% set raw = states.binary_sensor.dining_right_person_occupancy %}
          {% if stable is not none and stable.state == 'on' %}
            {% if raw is not none and raw.state == 'off' %}
              {{ ((raw.last_changed - stable.last_changed).total_seconds() * 1000) | round(0) }}
            {% else %}
              {{ ((now() - stable.last_changed).total_seconds() * 1000) | round(0) }}
