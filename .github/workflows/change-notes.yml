name: change notes

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check change-note fragments
        env:
          CHANGE_NOTE_BASE: origin/${{ github.base_ref }}
          NO_RELEASE_NOTE: ${{ contains(github.event.pull_request.labels.*.name, 'no-release-note') }}
        run: node tools/release/check-change-notes.mjs
