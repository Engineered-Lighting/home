        unique_id: kitchen_whole_kitchen_lighting_state
        icon: mdi:state-machine
        state: >
          {% set manual = is_state('input_boolean.living_lights_override_whole_kitchen', 'on') %}
          {% set away = is_state('input_boolean.user_at_home', 'off') %}
          {% set override_raw = states('input_text.living_lights_override_text_whole_kitchen') %}
          {% set has_override = override_raw not in ['', 'unknown', 'unavailable', None] %}
          {% set night = is_state('binary_sensor.living_lights_is_night_safe', 'on') %}
          {% set stable_obj = states.binary_sensor.kitchen_whole_kitchen_person_occupancy_stable %}
          {% set stable = states('binary_sensor.kitchen_whole_kitchen_person_occupancy_stable') %}
          {% set raw_obj = states.binary_sensor.whole_kitchen_person_occupancy %}
          {% set raw_state = states('binary_sensor.whole_kitchen_person_occupancy') %}
          {% set t_end = raw_obj.last_changed if (raw_obj is not none and raw_state == 'off') else now() %}
          {% set dwell = ((t_end - stable_obj.last_changed).total_seconds() * 1000) | round(0) if (stable_obj is not none and stable == 'on') else 0 %}
          {% set speed = states('sensor.kitchen_whole_kitchen_avg_speed') | float(0) %}
          {# Phase 4 anticipation: only consulted when stable == 'off'.
             Master kill switch input_boolean.living_lights_anticipated_enabled
             gates the whole feature — OFF disables anticipation everywhere
             without touching the rest of the state machine. #}
          {% set anti_kill = is_state('input_boolean.living_lights_anticipated_enabled', 'on') %}
          {% set anti_tv = states('media_player.lg_tv') not in ['off', 'unavailable', 'unknown'] %}
          {% set anti_obj = states.binary_sensor.anticipated_kitchen %}
          {% set anti_on = (not anti_tv) and anti_obj is not none and (anti_obj.state == 'on' or (anti_obj.last_changed and (now() - anti_obj.last_changed).total_seconds() < 12)) %}
          {% if manual %}manual_override
          {% elif away %}away
          {% elif has_override %}presence_override
          {% elif night %}night_safe
          {% elif stable == 'off' and anti_kill and anti_on %}anticipated
          {% elif stable == 'off' %}vacant
          {% elif dwell < 2000 and speed >= 1.0 %}pass_through
          {% else %}present
          {% endif %}
        attributes:
          predicted_brightness_pct: >
            {% set manual = is_state('input_boolean.living_lights_override_whole_kitchen', 'on') %}
            {% set away = is_state('input_boolean.user_at_home', 'off') %}
            {% set override_raw = states('input_text.living_lights_override_text_whole_kitchen') %}
            {% set has_override = override_raw not in ['', 'unknown', 'unavailable', None] %}
            {% set night = is_state('binary_sensor.living_lights_is_night_safe', 'on') %}
            {% set asleep = is_state('input_boolean.living_lights_asleep', 'on') %}
            {% set tv_playing = states('media_player.lg_tv') not in ['off', 'unavailable', 'unknown'] %}
            {# Gaming modifier — populated only when (a) master toggle is on
               AND (b) Steam's `game` attribute reports a running game. Defensive
               guards cover the three "no value" cases HA might surface. #}
            {% set gaming_active = is_state('input_boolean.living_lights_gaming_enabled', 'on')
                                   and state_attr('sensor.steam_steam_76561198136331341', 'game')
                                       not in [none, '', 'unavailable', 'unknown'] %}
            {# Working-hours modifier — read live from the working_hours_active
               composite binary_sensor (toggle + woke_up + weekday + 08-18). The
               input_number reads carry literal fallbacks matching the initial
               values so a missing helper degrades gracefully. #}
            {% set working_hours_active = is_state('binary_sensor.living_lights_working_hours_active', 'on') %}
            {% set working_hours_floor_pct = states('input_number.living_lights_working_hours_floor_pct') | int(80) %}
            {% set working_hours_present_pct = states('input_number.living_lights_working_hours_present_pct') | int(95) %}
            {# Promoted-constant reads — every literal that used to be baked
               into the template is now an input_number with a fallback to
               the original generator constant. Drag a slider, value
               propagates within ~5 s. If the helper goes missing the
               classifier degrades gracefully to the original value. #}
            {% set vacant_day_pct = states('input_number.living_lights_vacant_day_pct') | int(50) %}
            {% set vacant_night_pct = states('input_number.living_lights_vacant_night_pct') | int(20) %}
            {% set ramp_target_pct = states('input_number.living_lights_ramp_target_pct') | int(80) %}
            {% set asleep_cap_pct = states('input_number.living_lights_asleep_cap_pct') | int(30) %}
            {% set movie_dim_pct = states('input_number.living_lights_movie_dim_pct') | int(8) %}
            {% set gaming_dim_pct = states('input_number.living_lights_gaming_dim_pct') | int(3) %}
            {# House-wide bias knobs (additive, applied AFTER the cascade,
               clamped at cap and at 0). Scope gated by input_text:
               'all' = apply globally, slug name = only that zone. #}
            {% set brightness_bias_pp = states('input_number.living_lights_brightness_bias_pp') | int(0) %}
            {% set bias_scope = states('input_text.living_lights_bias_zone_scope') %}
            {% set bias_active = bias_scope in ['all', 'whole_kitchen'] %}
            {% set belief = is_state('input_boolean.living_lights_actuate_from_belief_changes', 'on') %}
            {% set activity = states('sensor.kitchen_whole_kitchen_activity') %}
            {% set stable_obj = states.binary_sensor.kitchen_whole_kitchen_person_occupancy_stable %}
            {% set stable = states('binary_sensor.kitchen_whole_kitchen_person_occupancy_stable') %}
            {% set raw_obj = states.binary_sensor.whole_kitchen_person_occupancy %}
            {% set raw_state = states('binary_sensor.whole_kitchen_person_occupancy') %}
            {% set t_end = raw_obj.last_changed if (raw_obj is not none and raw_state == 'off') else now() %}
            {% set dwell = ((t_end - stable_obj.last_changed).total_seconds() * 1000) | round(0) if (stable_obj is not none and stable == 'on') else 0 %}
            {% set speed = states('sensor.kitchen_whole_kitchen_avg_speed') | float(0) %}
            {% set tf = state_attr('sensor.living_lights_profile', 'tod_factor') | float(0.5) %}
            {# Cap is asleep-gated: a navigable ceiling only while actually asleep
               (you got up briefly); otherwise no ToD cap on occupied — an
               occupied room is always usable. Overnight gentleness is the
               asleep state's job, not a blanket clock cap. #}
            {% set cap = asleep_cap_pct if asleep else 100 %}
            {% set profile = states('sensor.living_lights_profile') %}
            {% set floor = 0 if asleep else (working_hours_floor_pct if working_hours_active else movie_dim_pct if tv_playing else (working_hours_floor_pct if working_hours_active else vacant_day_pct if profile in ['morning', 'midday', 'afternoon', 'evening'] else vacant_night_pct)) %}
            {# Phase 4 anticipation — same gating as the state branch. Brightness
               is floored at the vacant baseline so anticipation NEVER dims a
               vacant zone (the actuator's raise-only branch adds a second
               guard against dimming a manually-set light). #}
            {% set anti_kill = is_state('input_boolean.living_lights_anticipated_enabled', 'on') %}
            {% set anti_tv = states('media_player.lg_tv') not in ['off', 'unavailable', 'unknown'] %}
            {% set anti_obj = states.binary_sensor.anticipated_kitchen %}
            {% set anti_on = (not anti_tv) and anti_obj is not none and (anti_obj.state == 'on' or (anti_obj.last_changed and (now() - anti_obj.last_changed).total_seconds() < 12)) %}
            {# Capture the cascade output to a string via {% set %}...{% endset %},
               then add the additive brightness bias (scope-gated), then
               clamp at [0, cap]. The | trim | int chain parses the captured
               render back to an integer so arithmetic works. #}
            {% set raw_bri %}
            {% if manual or away or has_override %}0
            {% elif night %}8
            {% elif stable == 'off' and anti_kill and anti_on %}{{ [floor, [50, cap] | min] | max }}
            {% elif stable == 'off' %}{{ floor }}
            {% elif dwell < 2000 and speed >= 1.0 %}{{ [floor, [55, cap] | min] | max }}
            {% else %}{% if working_hours_active %}{{ [working_hours_present_pct, cap] | min }}{% elif belief and activity == 'cooking' %}{{ [100, cap] | min }}{% elif belief and activity == 'working_out' %}{{ [95, cap] | min }}{% elif belief and activity == 'working' %}{{ [85, cap] | min }}{% elif belief and activity == 'reading' %}{{ [80, cap] | min }}{% elif belief and activity == 'eating' %}{{ [70, cap] | min }}{% elif belief and activity == 'watching_tv' %}{{ [8, cap] | min }}{% elif belief and activity == 'napping' %}{{ [3, cap] | min }}{% else %}{{ [floor, [ramp_target_pct, cap] | min] | max }}{% endif %}{% endif %}
            {% endset %}
            {% set final_bri = (raw_bri | trim | int(0)) + (brightness_bias_pp if bias_active else 0) %}
            {{ [[0, final_bri] | max, cap] | min }}
          ramp_initial_pct: >
            {% set ramp_initial_pct = states('input_number.living_lights_ramp_initial_pct') | int(50) %}
            {% set tf = state_attr('sensor.living_lights_profile', 'tod_factor') | float(0.5) %}
            {% set cap = state_attr('sensor.living_lights_profile', 'max_brightness_pct') | int(100) %}
            {{ [(ramp_initial_pct * tf) | round(0) | int, cap] | min }}
          predicted_color_temp_kelvin: >
            {% set night = is_state('binary_sensor.living_lights_is_night_safe', 'on') %}
            {% set warm = state_attr('sensor.living_lights_profile', 'tod_color_warm') | int(2700) %}
            {# Warmth bias — additive on the cascade output, scope-gated,
               clamped to AL min (2000) / max (4000) to keep Hue happy. #}
            {% set warmth_bias_k = states('input_number.living_lights_warmth_bias_k') | int(0) %}
            {% set bias_scope = states('input_text.living_lights_bias_zone_scope') %}
            {% set bias_active = bias_scope in ['all', 'whole_kitchen'] %}
            {% set raw_ct = 2000 if night else warm %}
            {% set final_ct = raw_ct + (warmth_bias_k if bias_active else 0) %}
            {{ [[2000, final_ct] | max, 4000] | min }}
          dwell_ms: >
            {% set stable = states.binary_sensor.kitchen_whole_kitchen_person_occupancy_stable %}
            {% if stable is not none and stable.state == 'on' %}
              {{ ((now() - stable.last_changed).total_seconds() * 1000) | round(0) }}
            {% else %}0{% endif %}
          speed_mps: "{{ states('sensor.kitchen_whole_kitchen_avg_speed') | float(0) }}"
          last_manual_at: >
            {{ states('input_datetime.living_lights_zone_whole_kitchen_last_manual_at') }}

  - trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - sensor.dining_room_dining_left_lighting_state
          - sensor.dining_room_dining_right_lighting_state
          - sensor.kitchen_sink_lighting_state
          - sensor.kitchen_island_left_lighting_state
          - sensor.kitchen_island_right_lighting_state
          - sensor.living_room_sofa_lighting_state
          - sensor.living_room_front_left_lighting_state
          - sensor.living_room_weights_lighting_state
          - sensor.living_room_office_lighting_state
          - sensor.living_room_front_door_lighting_state
          - sensor.living_room_whole_living_room_lighting_state
          - sensor.workshop_workshop_zone_lighting_state
          - sensor.driveway_e28_lighting_state
          - sensor.dining_room_whole_dining_room_lighting_state
          - sensor.kitchen_whole_kitchen_lighting_state
      - platform: time_pattern
        minutes: "/2"
    binary_sensor:
      - name: "Living Lights Any Occupied"
        unique_id: living_lights_any_occupied
        device_class: occupancy
        icon: mdi:account-group
        state: >
          {% set ns = namespace(occ=false) %}
          {% if states('sensor.dining_room_dining_left_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.dining_room_dining_right_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.kitchen_sink_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.kitchen_island_left_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.kitchen_island_right_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.living_room_sofa_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.living_room_front_left_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.living_room_weights_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.living_room_office_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.living_room_front_door_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.living_room_whole_living_room_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.workshop_workshop_zone_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.driveway_e28_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.dining_room_whole_dining_room_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.kitchen_whole_kitchen_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {{ ns.occ }}

