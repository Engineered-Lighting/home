<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>den-register: click the control points</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1b1b1b; --muted: #666; --line: #ccc;
          --fit: #0a7d32; --check: #0b5cad; --bad: #b3261e; --sel: #f2b705; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --fg: #e8e8e8; --muted: #9a9a9a; --line: #3a3a3a; --fit: #43c06b;
            --check: #5aa3ef; --bad: #ff6b60; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  main { display: flex; gap: 16px; padding: 12px 16px; align-items: flex-start; flex-wrap: wrap; }
  #stage { position: relative; flex: 1 1 640px; max-width: 1280px; }
  canvas { width: 100%; height: auto; display: block; image-rendering: pixelated; cursor: crosshair;
           border: 1px solid var(--line); }
  canvas.look { cursor: default; }
  aside { flex: 0 1 320px; min-width: 260px; }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  tr.point { cursor: pointer; }
  tr.point.selected { outline: 2px solid var(--sel); }
  .fit { color: var(--fit); } .check { color: var(--check); } .bad { color: var(--bad); }
  .muted { color: var(--muted); }
  button { font: inherit; padding: 4px 10px; margin: 2px 4px 2px 0; }
  #msg { min-height: 1.4em; margin: 6px 0; }
  #msg.error { color: var(--bad); font-weight: 600; }
  header { padding: 8px 16px; border-bottom: 1px solid var(--line); }
</style>
</head>
<body>
<header><strong>den-register</strong> <span id="what" class="muted"></span></header>
<main>
  <div id="stage">
    <canvas id="view" width="640" height="400"></canvas>
    <div>
      <button id="viewLeft">Left camera (click here)</button>
      <button id="viewRgb">Colour (look only)</button>
      <button id="gamma">Brightness</button>
    </div>
  </div>
  <aside>
    <p>Pick a point in the list, then click its centre on the <b>left camera</b> image.
       Click again to move it. Leave a point unclicked if it is hidden.</p>
    <div id="msg"></div>
    <table><thead><tr><th>Point</th><th>Role</th><th>Click</th></tr></thead><tbody id="points"></tbody></table>
    <p>
      <button id="clear">Clear selected</button>
      <button id="done">Done</button>
    </p>
    <p class="muted">This page is served from this PC only (127.0.0.1). Frames never leave it.</p>
  </aside>
</main>
<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const LW = 640, LH = 400, RW = 640, RH = 360;
const $ = id => document.getElementById(id);
const view = $("view"), ctx = view.getContext("2d");
let S = null, left = null, rgb = null, mode = "left", gammaIx = 0, selected = null, ended = false;

function api(path, body) {
  const opts = {headers: {"X-Reg-Token": TOKEN}, cache: "no-store"};
  if (body !== undefined) {
    opts.method = "POST";
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  return fetch(path, opts);
}

function say(text, error) {
  $("msg").textContent = text;
  $("msg").className = error ? "error" : "";
}

function lut() {
  const g = [1, 1.8, 2.6][gammaIx], out = new Uint8ClampedArray(256);
  for (let v = 0; v < 256; v++) out[v] = Math.round(255 * Math.pow(v / 255, 1 / g));
  return out;
}

function drawLeft() {
  view.width = LW; view.height = LH;
  const img = ctx.createImageData(LW, LH), d = img.data, l = lut();
  for (let i = 0; i < LW * LH; i++) {
    const v = l[left[i]], o = i * 4;
    d[o] = d[o + 1] = d[o + 2] = v; d[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  for (const p of S.points) {
    const c = S.clicks[p.id];
    if (!c) continue;
    ctx.strokeStyle = p.id === selected ? "#f2b705" : (p.role === "fit" ? "#2ecc71" : "#4aa3ff");
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(c.u - 7, c.v); ctx.lineTo(c.u + 7, c.v);
    ctx.moveTo(c.u, c.v - 7); ctx.lineTo(c.u, c.v + 7);
    ctx.stroke();
    ctx.fillStyle = ctx.strokeStyle;
    ctx.font = "12px system-ui, sans-serif";
    ctx.fillText(p.id, c.u + 6, c.v - 6);
  }
}

function drawRgb() {
  view.width = RW; view.height = RH;
  const img = ctx.createImageData(RW, RH), d = img.data, l = lut(), base = RW * RH;
  for (let y = 0; y < RH; y++) {
    const row = base + (y >> 1) * RW;
    for (let x = 0; x < RW; x++) {
      const c = 1.164 * (rgb[y * RW + x] - 16), k = row + (x & ~1);
      const u = rgb[k] - 128, v = rgb[k + 1] - 128, o = (y * RW + x) * 4;
      d[o] = l[Math.max(0, Math.min(255, c + 1.596 * v)) | 0];
      d[o + 1] = l[Math.max(0, Math.min(255, c - 0.392 * u - 0.813 * v)) | 0];
      d[o + 2] = l[Math.max(0, Math.min(255, c + 2.017 * u)) | 0];
      d[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

function draw() {
  view.className = mode === "left" ? "" : "look";
  if (mode === "left") drawLeft(); else drawRgb();
}

function table() {
  const body = $("points");
  body.textContent = "";
  for (const p of S.points) {
    const tr = document.createElement("tr"), c = S.clicks[p.id];
    tr.className = "point" + (p.id === selected ? " selected" : "");
    const cells = [p.id + (p.label ? " — " + p.label : ""), p.role,
                   c ? `${c.u.toFixed(1)}, ${c.v.toFixed(1)} · ${c.z_m.toFixed(3)} m` : "—"];
    cells.forEach((text, i) => {
      const td = document.createElement("td");
      td.textContent = text;
      if (i === 1) td.className = p.role;
      if (i === 2 && !c) td.className = "muted";
      tr.appendChild(td);
    });
    tr.addEventListener("click", () => { selected = p.id; table(); draw(); });
    body.appendChild(tr);
  }
}

async function bytes(path) {
  const r = await api(path);
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return new Uint8Array(await r.arrayBuffer());
}

async function load() {
  const r = await api("/api/state");
  if (!r.ok) throw new Error(`state: ${r.status}`);
  S = await r.json();
  $("what").textContent = `take ${S.take} · frame ${S.frame} · ${S.points.length} points`;
  left = await bytes("/api/left");
  rgb = await bytes("/api/rgb");
  selected = (S.points.find(p => !S.clicks[p.id]) || S.points[0] || {}).id || null;
  table();
  draw();
}

view.addEventListener("click", async ev => {
  if (ended || mode !== "left") return;
  if (!selected) { say("Pick a point in the list first.", true); return; }
  const box = view.getBoundingClientRect();
  const u = Math.round((ev.clientX - box.left) / box.width * LW * 10) / 10;
  const v = Math.round((ev.clientY - box.top) / box.height * LH * 10) / 10;
  const r = await api("/api/click", {id: selected, u, v});
  const answer = await r.json();
  if (!r.ok) { say(answer.error || `click refused (${r.status})`, true); return; }
  S.clicks = answer.clicks;
  say(`${selected}: depth ${S.clicks[selected].z_m.toFixed(3)} m from ${S.clicks[selected].valid} pixels.`);
  const next = S.points.find(p => !S.clicks[p.id]);
  if (next) selected = next.id;
  table();
  draw();
});

$("clear").addEventListener("click", async () => {
  if (ended || !selected) return;
  const r = await api("/api/clear", {id: selected});
  const answer = await r.json();
  if (!r.ok) { say(answer.error || "clear refused", true); return; }
  S.clicks = answer.clicks;
  say(`${selected} cleared.`);
  table();
  draw();
});

$("done").addEventListener("click", async () => {
  if (ended) return;
  const r = await api("/api/done", {done: true});
  if (r.ok) {
    ended = true;
    say("Saved. You can close this tab; the window that started it says what is next.");
  }
});

$("viewLeft").addEventListener("click", () => { mode = "left"; draw(); });
$("viewRgb").addEventListener("click", () => { mode = "rgb"; draw(); });
$("gamma").addEventListener("click", () => { gammaIx = (gammaIx + 1) % 3; draw(); });

load().catch(err => say(String(err.message || err), true));
</script>
</body>
</html>
