                entity_id: input_boolean.living_lights_learning_enabled
                state: "on"
            then:
              - variables:
                  json_payload: >-
                    {{ {
                      'kind': 'override_event',
                      'ts': now().isoformat(),
                      'context_id': ctx_id,
                      'zone': 'weights',
                      'light_entity': 'light.rear_right',
                      'camera': 'living_room',
                      'owning_zones': ['weights', 'sofa'],
                      'observed': {'brightness_pct': actual_pct | int(0), 'light_state': light_state},
                      'predicted': {
