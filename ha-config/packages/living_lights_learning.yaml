              primary_zone: "front_left"
              light_entity: "light.front_left"
              owning_zones: ['front_left', 'sofa']
              captured_brightness_pct: "{{ actual_bri | int(0) }}"
              captured_color_temp_kelvin: "{{ actual_ct | int(0) }}"
              predicted_brightness_pct: "{{ predicted_bri | int(0) }}"
              predicted_color_temp_kelvin: "{{ predicted_ct | int(0) }}"
              predictions_by_zone:
                front_left:
                  state: "{{ pred_front_left_state }}"
                  predicted_pct: "{{ pred_front_left_p | int(0) }}"
                  ramp_initial_pct: "{{ pred_front_left_ri | int(0) }}"
                sofa:
                  state: "{{ pred_sofa_state }}"
