<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Home · Lighting</title>
  <link rel="stylesheet" href="./preference-review.css">
  <script defer src="./api.js"></script>
  <script defer src="./lighting-review.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">LIGHTING · CONFIRM BEFORE ANYTHING CHANGES</p>
    <p id="status" role="status" aria-live="polite">Checking your Home session…</p>
    <ul id="changes" hidden></ul>
    <p id="detail"></p>
    <div class="actions">
      <button id="confirm" type="button" disabled hidden>Confirm</button>
      <button id="check" type="button" hidden>Check outcome</button>
      <button id="retry-session" type="button" hidden>Check sign-in</button>
      <a id="sign-in" href="./index.html" target="_blank" rel="noopener noreferrer" hidden>Sign in to Home Agent</a>
      <button id="cancel" type="button" class="quiet" hidden>Cancel</button>
    </div>
    <p class="note">Only these lights change, once, after you confirm.</p>
  </main>
</body>
</html>
