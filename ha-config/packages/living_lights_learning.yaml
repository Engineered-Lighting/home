      - platform: state
        entity_id:
          - light.dining_table_left
          - light.dining_table_right
          - light.front_right
          - light.sink
          - light.island_left
          - light.island_right
          - light.office
          - light.rear_right
          - light.front_left
          - light.rear_left
        attribute: brightness
      - platform: state
        entity_id:
          - light.dining_table_left
          - light.dining_table_right
          - light.front_right
          - light.sink
          - light.island_left
          - light.island_right
          - light.office
          - light.rear_right
          - light.front_left
          - light.rear_left
        attribute: color_temp_kelvin
      - platform: homeassistant
        event: start
      - platform: time_pattern
        seconds: "/30"
    binary_sensor:
      - name: "Living Lights — dining_left deviation"
        unique_id: living_lights_deviation_dining_left
        icon: mdi:alert-circle-outline
        state: >
          {% set light = states.light.dining_table_left %}
          {% set bri_thr_pct = states('input_number.living_lights_learning_bri_threshold_pct') | float(15) %}
          {% set ct_thr = states('input_number.living_lights_learning_ct_threshold_kelvin') | float(500) %}
          {% if light is none or light.state != 'on' %}
            false
          {% else %}
            {% set actual_bri = (light.attributes.brightness | int(0)) / 2.55 %}
            {% set actual_ct = light.attributes.color_temp_kelvin | int(2700) %}
            {% set predicted_bri = state_attr('sensor.dining_room_dining_left_lighting_state', 'predicted_brightness_pct') | int(0) %}
            {% set predicted_ct = state_attr('sensor.dining_room_dining_left_lighting_state', 'predicted_color_temp_kelvin') | int(2700) %}
            {% if predicted_bri == 0 %}
              false
            {% else %}
              {{ (actual_bri - predicted_bri) | abs > bri_thr_pct or (actual_ct - predicted_ct) | abs > ct_thr }}
            {% endif %}
          {% endif %}
        attributes:
          zone: dining_left
          light_entity: "light.dining_table_left"
          actual_brightness_pct: >
            {% set light = states.light.dining_table_left %}
            {% if light and light.state == 'on' %}
              {{ ((light.attributes.brightness | int(0)) / 2.55) | round(0) }}
            {% else %}0{% endif %}
          actual_color_temp_kelvin: >
            {% set light = states.light.dining_table_left %}
            {% if light and light.state == 'on' %}
              {{ light.attributes.color_temp_kelvin | int(2700) }}
            {% else %}0{% endif %}
          predicted_brightness_pct: >
            {{ state_attr('sensor.dining_room_dining_left_lighting_state', 'predicted_brightness_pct') | int(0) }}
