# NOT merged anywhere — copy this service block into stack/docker-compose.yml
# when deploying. Assumes the existing external `homeai` network.
services:
  spatial-tracker:
    build: ./services/spatial-tracker
    container_name: hav-spatial-tracker
    restart: unless-stopped
    ports:
      # Research adapter is quarantined to the host; expose a reviewed bind
      # address explicitly only after adding service authentication.
      - "127.0.0.1:8098:8098"
    volumes:
      - ./services/spatial-tracker/data:/data
    environment:
      - MQTT_HOST=192.168.0.125
      - MQTT_PORT=1883
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASS=${MQTT_PASS:-}
      - FRIGATE_URL=http://192.168.0.125:5000
      - HA_URL=http://192.168.0.125:8123
      # No HA bearer: the quarantined tracker may use its on-disk model and
      # untrusted sensor feeds, but cannot call HA APIs or services.
      - HA_TOKEN=
      - DATA_DIR=/data
      - PORT=8098
      - REPLAY_MODE=0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8098/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - homeai

networks:
  homeai:
    external: true
