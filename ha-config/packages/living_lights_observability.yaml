            {% set t_end = raw_obj.last_changed if (raw_obj is not none and raw_state == 'off') else now() %}
            {% set dwell = ((t_end - stable_obj.last_changed).total_seconds() * 1000) | round(0) if (stable_obj is not none and stable == 'on') else 0 %}
            {% set speed = states('sensor.kitchen_whole_kitchen_avg_speed') | float(0) %}
            {% set tf = state_attr('sensor.living_lights_profile', 'tod_factor') | float(0.5) %}
            {# Cap is asleep-gated: a navigable ceiling only while actually asleep
               (you got up briefly); otherwise no ToD cap on occupied — an
               occupied room is always usable. Overnight gentleness is the
               asleep state's job, not a blanket clock cap. #}
            {% set cap = 30 if asleep else 100 %}
            {% set profile = states('sensor.living_lights_profile') %}
            {% set floor = 0 if asleep else (8 if tv_playing else (50 if profile in ['morning', 'midday', 'afternoon', 'evening'] else 20)) %}
            {# Phase 4 anticipation — same gating as the state branch. Brightness
               is floored at the vacant baseline so anticipation NEVER dims a
               vacant zone (the actuator's raise-only branch adds a second
               guard against dimming a manually-set light). #}
            {% set anti_kill = is_state('input_boolean.living_lights_anticipated_enabled', 'on') %}
            {% set anti_tv = states('media_player.lg_tv') not in ['off', 'unavailable', 'unknown'] %}
            {% set anti_obj = states.binary_sensor.anticipated_kitchen %}
            {% set anti_on = (not anti_tv) and anti_obj is not none and (anti_obj.state == 'on' or (anti_obj.last_changed and (now() - anti_obj.last_changed).total_seconds() < 12)) %}
            {% if manual or away or has_override %}0
            {% elif night %}8
            {% elif stable == 'off' and anti_kill and anti_on %}{{ [floor, [50, cap] | min] | max }}
            {% elif stable == 'off' %}{{ floor }}
            {% elif dwell < 2000 and speed >= 1.0 %}{{ [floor, [55, cap] | min] | max }}
            {% else %}{% if belief and activity == 'cooking' %}{{ [100, cap] | min }}{% elif belief and activity == 'working_out' %}{{ [95, cap] | min }}{% elif belief and activity == 'working' %}{{ [85, cap] | min }}{% elif belief and activity == 'reading' %}{{ [80, cap] | min }}{% elif belief and activity == 'eating' %}{{ [70, cap] | min }}{% elif belief and activity == 'watching_tv' %}{{ [8, cap] | min }}{% elif belief and activity == 'napping' %}{{ [3, cap] | min }}{% else %}{{ [floor, [80, cap] | min] | max }}{% endif %}{% endif %}
          ramp_initial_pct: >
            {% set tf = state_attr('sensor.living_lights_profile', 'tod_factor') | float(0.5) %}
            {% set cap = state_attr('sensor.living_lights_profile', 'max_brightness_pct') | int(100) %}
            {{ [(50 * tf) | round(0) | int, cap] | min }}
          predicted_color_temp_kelvin: >
            {% set night = is_state('binary_sensor.living_lights_is_night_safe', 'on') %}
            {% set warm = state_attr('sensor.living_lights_profile', 'tod_color_warm') | int(2700) %}
            {% if night %}2000{% else %}{{ warm }}{% endif %}
          dwell_ms: >
            {% set stable = states.binary_sensor.kitchen_whole_kitchen_person_occupancy_stable %}
            {% if stable is not none and stable.state == 'on' %}
              {{ ((now() - stable.last_changed).total_seconds() * 1000) | round(0) }}
            {% else %}0{% endif %}
          speed_mps: "{{ states('sensor.kitchen_whole_kitchen_avg_speed') | float(0) }}"
          last_manual_at: >
            {{ states('input_datetime.living_lights_zone_whole_kitchen_last_manual_at') }}

  - trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - sensor.dining_room_dining_left_lighting_state
          - sensor.dining_room_dining_right_lighting_state
          - sensor.kitchen_sink_lighting_state
          - sensor.kitchen_island_left_lighting_state
          - sensor.kitchen_island_right_lighting_state
          - sensor.living_room_sofa_lighting_state
          - sensor.living_room_front_left_lighting_state
          - sensor.living_room_weights_lighting_state
          - sensor.living_room_office_lighting_state
          - sensor.living_room_front_door_lighting_state
          - sensor.living_room_whole_living_room_lighting_state
          - sensor.workshop_workshop_zone_lighting_state
          - sensor.driveway_e28_lighting_state
          - sensor.dining_room_whole_dining_room_lighting_state
          - sensor.kitchen_whole_kitchen_lighting_state
      - platform: time_pattern
        minutes: "/2"
    binary_sensor:
      - name: "Living Lights Any Occupied"
        unique_id: living_lights_any_occupied
        device_class: occupancy
        icon: mdi:account-group
        state: >
          {% set ns = namespace(occ=false) %}
          {% if states('sensor.dining_room_dining_left_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.dining_room_dining_right_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.kitchen_sink_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.kitchen_island_left_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.kitchen_island_right_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.living_room_sofa_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.living_room_front_left_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.living_room_weights_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.living_room_office_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.living_room_front_door_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.living_room_whole_living_room_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.workshop_workshop_zone_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.driveway_e28_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.dining_room_whole_dining_room_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {% if states('sensor.kitchen_whole_kitchen_lighting_state') in ['present', 'pass_through'] %}{% set ns.occ = true %}{% endif %}
          {{ ns.occ }}

